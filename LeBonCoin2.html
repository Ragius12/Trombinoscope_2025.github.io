<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le bon Coin² – Blablac'Arts</title>

<style>
/* === STYLE INCHANGÉ === */
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f5;color:#222}
header{background:#1b2340;color:#ffd76a;padding:18px;text-align:center;font-size:1.9em;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:20px}
.btn{background:#ffd76a;border:none;padding:8px 14px;font-weight:bold;cursor:pointer;border-radius:6px}
.btn.secondary{background:#2b3150;color:white}
.btn.danger{background:#d9534f;color:white}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.card{background:white;border-radius:8px;padding:15px;margin-bottom:18px;display:flex;gap:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
.card img{width:180px;height:130px;object-fit:cover;border-radius:6px;cursor:pointer}
.card-content{flex:1}
.price{color:#1b2340;font-weight:bold;font-size:1.2em}
.actions{margin-top:10px;display:flex;gap:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10}
.modal-content{background:white;padding:20px;border-radius:10px;width:420px}
input,select,textarea{width:100%;padding:8px;margin:6px 0}
</style>
</head>

<body>

<header>Blablac'Arts — Le bon Coin²</header>

<div class="container">
  <div class="topbar">
    <button class="btn" onclick="openModal()">➕ Publier une annonce</button>
  </div>
  <div id="ads">Chargement...</div>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle">Nouvelle annonce</h3>

<select id="type" onchange="updateFields()">
  <option value="kgibs">🏠 Kgib’s</option>
  <option value="objets">📦 Objets</option>
  <option value="tech">💻 Tech</option>
  <option value="services">🛠️ Services</option>
  <option value="art">🎨 Art</option>
  <option value="autre">✨ Autre</option>
</select>

<input id="title" placeholder="Titre *">
<textarea id="description" placeholder="Description"></textarea>
<div id="dynamicFields"></div>
<input type="file" id="images" multiple accept="image/*">

<button class="btn" onclick="publish()">Publier</button>
<button class="btn secondary" onclick="closeModal()">Annuler</button>
</div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "TON_ANON_KEY_ICI"
)

let user=null, editId=null
const $=id=>document.getElementById(id)

/* ✅ AJOUT : attente ACTIVE de la session */
async function waitForUser(){
  for(let i=0;i<20;i++){
    const { data:{session} } = await sb.auth.getSession()
    if(session?.user) return session.user
    await new Promise(r=>setTimeout(r,100))
  }
  return null
}

window.openModal=()=>{$("modal").style.display="flex";resetModal()}
window.closeModal=()=> $("modal").style.display="none"

function resetModal(){
  editId=null
  $("title").value=""
  $("description").value=""
  $("images").value=""
  $("type").value="kgibs"
  updateFields()
}

window.updateFields=()=>{
  $("dynamicFields").innerHTML = $("type").value==="kgibs" ? `
    <input id="price" type="number" placeholder="Prix € *">
    <input id="surface" type="number" placeholder="Surface m² *">
    <input id="rooms" type="number" placeholder="Pièces *">
    <input id="location" placeholder="Localisation *">
  ` : `
    <input id="price" type="number" placeholder="Prix € *">
    <input id="state" placeholder="État *">
  `
}

window.publish=async()=>{
  if(!user) return alert("Connexion requise")

  if(!$("title").value) return alert("Titre obligatoire")
  if(!$("price")?.value) return alert("Prix obligatoire")

  const price = Number(String($("price").value).replace(",", "."))

  const urls=[]
  for(const file of $("images").files){
    const path=`${user.id}/${Date.now()}-${file.name}`
    const { error } = await sb.storage.from("ads-images").upload(path,file)
    if(error) return alert(error.message)
    urls.push(sb.storage.from("ads-images").getPublicUrl(path).data.publicUrl)
  }

  const payload={
    owner:user.id,
    type:$("type").value,
    title:$("title").value,
    description:$("description").value||null,
    price,
    surface:Number($("surface")?.value)||null,
    rooms:Number($("rooms")?.value)||null,
    state:$("state")?.value||null,
    location:$("location")?.value||null,
    images:urls
  }

  const { error } = editId
    ? await sb.from("ads").update(payload).eq("id",editId)
    : await sb.from("ads").insert(payload)

  if(error) return alert(error.message)

  closeModal()
  resetModal()
  loadAds()
}

window.loadAds=async()=>{
  if(!user) return

  const {data,error}=await sb.from("ads").select("*").order("created_at",{ascending:false})

  if(error || !data){
    $("ads").innerHTML="Aucune annonce."
    return
  }

  $("ads").innerHTML=""
  data.forEach(a=>{
    $("ads").innerHTML+=`
    <div class="card">
      ${a.images?.[0]?`<img src="${a.images[0]}">`:""}
      <div class="card-content">
        <b>${a.title}</b><br>
        <span class="price">${a.price} €</span><br>
        ${a.description||""}
      </div>
    </div>`
  })
}

const init=async()=>{
  user = await waitForUser()

  if(!user){
    document.body.innerHTML="<h2 style='text-align:center;margin-top:80px'>Connexion requise</h2>"
    return
  }

  updateFields()
  loadAds()
}

init()
</script>

</body>
</html>
