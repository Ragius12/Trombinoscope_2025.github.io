<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le bon Coin² – Blablac'Arts</title>

<style>
body{
  margin:0;
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(180deg,#1b2340,#11162a);
  color:#f0f0f0;
}
h1{text-align:center;padding:30px;font-size:2.2em}
.container{max-width:1000px;margin:auto;padding:20px}
.block{
  background:rgba(255,255,255,0.06);
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
}
.btn{
  background:#ffd76a;color:#000;border:none;
  padding:10px 18px;border-radius:10px;
  font-weight:bold;cursor:pointer
}
.btn.secondary{background:#2b3150;color:white}
.btn.danger{background:#ff6b6b;color:black}
input,select,textarea{
  width:100%;margin:6px 0;padding:10px;
  border-radius:8px;border:none;
  background:#2b3150;color:white
}
.card{
  background:#222a4a;border-radius:14px;
  padding:15px;margin-bottom:15px
}
.price{color:#7dffb3;font-weight:bold}
.slider img{
  width:100%;border-radius:10px;margin-bottom:8px
}
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center
}
.modal-content{
  background:#1f2545;border-radius:16px;
  padding:25px;width:420px
}
.actions{
  margin-top:10px;
  display:flex;
  gap:10px
}
</style>
</head>

<body>

<h1>Blablac'Arts — Le bon Coin²</h1>

<div class="container">

<div class="block">
  <button class="btn" onclick="openModal()">➕ Publier une annonce</button>
</div>

<div class="block">
  <div id="ads">Chargement...</div>
</div>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2 id="modalTitle">Nouvelle annonce</h2>

<select id="type" onchange="updateFields()">
  <option value="kgibs">🏠 Kgib’s</option>
  <option value="objets">📦 Objets</option>
  <option value="tech">💻 Tech</option>
  <option value="services">🛠️ Services</option>
  <option value="art">🎨 Art</option>
  <option value="autre">✨ Autre</option>
</select>

<input id="title" placeholder="Titre *">
<textarea id="description" placeholder="Description"></textarea>

<div id="dynamicFields"></div>

<input type="file" id="images" multiple accept="image/*">

<button class="btn" onclick="publish()">Publier</button>
<button class="btn secondary" onclick="closeModal()">Annuler</button>
</div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
);

let user=null
let editId=null
const $=id=>document.getElementById(id)

window.openModal=()=>{
  resetModal()
  $("modal").style.display="flex"
}
window.closeModal=()=> $("modal").style.display="none"

function resetModal(){
  editId=null
  $("modalTitle").innerText="Nouvelle annonce"
  $("title").value=""
  $("description").value=""
  $("images").value=""
  $("type").value="kgibs"
  updateFields()
}

window.updateFields=()=>{
  const t=$("type").value
  $("dynamicFields").innerHTML = t==="kgibs" ? `
    <input id="price" type="number" placeholder="Prix € *">
    <input id="surface" type="number" placeholder="Surface m² *">
    <input id="rooms" type="number" placeholder="Pièces *">
    <input id="location" placeholder="Localisation *">
  ` : `
    <input id="price" type="number" placeholder="Prix € *">
    <input id="state" placeholder="État *">
  `
}

window.publish=async()=>{
  try{
    const type=$("type").value
    if(!$("title").value) return alert("Titre obligatoire")
    if(!Number($("price")?.value)) return alert("Prix obligatoire")

    if(type==="kgibs"){
      if(!$("surface").value||!$("rooms").value||!$("location").value)
        return alert("Champs Kgib’s obligatoires")
    }else{
      if(!$("state").value) return alert("État obligatoire")
    }

    const urls=[]
    for(const file of $("images").files){
      const path=`${user.id}/${Date.now()}-${file.name}`
      const { error } = await sb.storage.from("ads-images").upload(
        path,
        file,
        {
          contentType: file.type || "image/png",
          upsert: false
        }
      )
      if(error) return alert(error.message)
      urls.push(sb.storage.from("ads-images").getPublicUrl(path).data.publicUrl)
    }

    const payload={
      owner:user.id,
      type,
      title:$("title").value,
      description:$("description").value||null,
      price:Number($("price").value),
      surface:Number($("surface")?.value)||null,
      rooms:Number($("rooms")?.value)||null,
      state:$("state")?.value||null,
      location:$("location")?.value||null,
      images:urls.length?urls:undefined
    }

    editId
      ? await sb.from("ads").update(payload).eq("id",editId)
      : await sb.from("ads").insert(payload)

    loadAds()
    closeModal()
  } finally {
    resetModal()
  }
}

window.editAd=a=>{
  editId=a.id
  $("modalTitle").innerText="Modifier annonce"
  $("modal").style.display="flex"
  $("type").value=a.type
  updateFields()
  $("title").value=a.title
  $("description").value=a.description||""
  $("price").value=a.price||""
  $("surface") && ($("surface").value=a.surface||"")
  $("rooms") && ($("rooms").value=a.rooms||"")
  $("location") && ($("location").value=a.location||"")
  $("state") && ($("state").value=a.state||"")
}

window.deleteAd=async id=>{
  if(!confirm("Supprimer cette annonce ?")) return
  await sb.from("ads").delete().eq("id",id)
  loadAds()
}

window.loadAds=async()=>{
  const {data}=await sb.from("ads").select("*").order("created_at",{ascending:false})
  $("ads").innerHTML=data?.length?"":"Aucune annonce."
  data?.forEach(a=>{
    $("ads").innerHTML+=`
    <div class="card">
      <b>${a.title}</b><br>
      <span class="price">${a.price} €</span>
      <div class="slider">
        ${(a.images||[]).map(i=>`<img src="${encodeURI(i)}">`).join("")}
      </div>
      ${a.description||""}
      ${a.owner===user.id?`
      <div class="actions">
        <button class="btn secondary" onclick='editAd(${JSON.stringify(a)})'>Modifier</button>
        <button class="btn danger" onclick="deleteAd(${a.id})">Supprimer</button>
      </div>`:""}
    </div>`
  })
}

const init=async()=>{
  user=(await sb.auth.getUser()).data.user
  if(!user){
    document.body.innerHTML="<h2 style='text-align:center;margin-top:80px'>Connexion requise</h2>"
    return
  }
  updateFields()
  loadAds()
}

init()
</script>
</body>
</html>
