<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Blablac'Arts — Le Bon Coin²</title>

<style>
:root{
  --main:#1b2340;
  --accent:#ffd76a;
  --bg:#eef1f5;
  --card:#fff;
  --shadow:0 8px 22px rgba(0,0,0,.1);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:#222
}

header{
  background:linear-gradient(135deg,var(--main),#2b3150);
  color:var(--accent);
  padding:18px;
  text-align:center;
  font-size:1.8em;
  font-weight:800
}

.container{max-width:1200px;margin:auto;padding:20px}

button{
  background:var(--accent);
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.25s
}
button.secondary{background:#2b3150;color:white}
button.danger{background:#d9534f;color:white}
button.icon{padding:6px 10px}
button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px
}
.tabs button.active{
  background:var(--main);
  color:white
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 220px;
  gap:16px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  transition:.25s
}
.card:hover{transform:translateY(-4px)}

.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:12px;
  cursor:pointer
}

.price{font-size:1.4em;font-weight:800;color:var(--main)}
.meta{font-size:.85em;opacity:.7}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px
}

.modal,.gallery{
  position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10
}
.modal-content{
  background:white;
  padding:20px;
  border-radius:16px;
  width:420px;
  max-height:90vh;
  overflow:auto
}
input,select,textarea{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc
}
textarea{resize:vertical}

.gallery img{max-width:80vw;max-height:80vh;border-radius:14px}
.close{position:absolute;top:20px;right:30px;font-size:30px;color:white;cursor:pointer}
</style>
</head>

<body>

<header>Blablac'Arts — Le Bon Coin²</header>

<div class="container">

  <div class="tabs">
    <button onclick="setTab('all')" id="tab-all" class="active">📢 Annonces</button>
    <button onclick="setTab('fav')" id="tab-fav">⭐ Favoris</button>
    <button onclick="setTab('mine')" id="tab-mine">📂 Mes annonces</button>
    <button onclick="openModal()">➕ Publier</button>
    <button class="secondary" onclick="adminLogin()">Admin</button>
  </div>

  <div class="filters">
    <select id="filterType"></select>
    <select id="filterSeen">
      <option value="">Toutes</option>
      <option value="unseen">Non vues</option>
    </select>
  </div>

  <div id="ads">Chargement…</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Annonce</h3>
    <select id="type"></select>
    <input id="title" placeholder="Titre *">
    <textarea id="description" placeholder="Description (facultatif)"></textarea>
    <input id="price" type="number" placeholder="Prix € *">
    <input id="contact" placeholder="Numéro WhatsApp *">
    <div id="dynamic"></div>
    <input type="file" id="images" multiple accept="image/*">
    <button onclick="publish()">Publier</button>
    <button class="secondary" onclick="closeModal()">Annuler</button>
  </div>
</div>

<div class="gallery" id="gallery" onclick="this.style.display='none'">
  <span class="close">✕</span>
  <img id="galleryImg">
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
);

const CONFIG={
  categories:[
    {id:"all",label:"🔍 Tout"},
    {id:"kgibs",label:"🏠 Kgib’s"},
    {id:"objets",label:"📦 Objets"},
    {id:"tech",label:"💻 Tech"},
    {id:"services",label:"🛠️ Services"},
    {id:"art",label:"🎨 Art"},
    {id:"autre",label:"✨ Autre"}
  ]
};

let user=null,isAdmin=false,editId=null,currentTab="all";
const $=id=>document.getElementById(id);

sb.auth.getUser().then(r=>user=r.data.user);

// Populate selects
CONFIG.categories.forEach(c=>{
  if(c.id!=="all") $("type").innerHTML+=`<option value="${c.id}">${c.label}</option>`;
  $("filterType").innerHTML+=`<option value="${c.id}">${c.label}</option>`;
});

window.adminLogin=()=>{
  if(prompt("Mot de passe admin")==="Error404trads"){
    isAdmin=true;
    alert("Mode admin : lecture seule");
    loadAds();
  }
};

window.setTab=tab=>{
  currentTab=tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  $("tab-"+tab).classList.add("active");
  loadAds();
};

window.openModal=()=>{$("modal").style.display="flex";resetModal();}
window.closeModal=()=>{$("modal").style.display="none";}

function resetModal(){
  editId=null;
  ["title","description","price","contact"].forEach(i=>$(i).value="");
  $("images").value=null;
  $("type").value="kgibs";
  updateFields();
}

window.updateFields=()=>{
  $("dynamic").innerHTML=
    $("type").value==="kgibs"
    ? `<input id="surface" placeholder="Surface m² *">
       <input id="rooms" placeholder="Pièces *">
       <input id="location" placeholder="Localisation *">`
    : `<input id="state" placeholder="État *">`;
};

window.publish=async()=>{
  const {data:{user:u}}=await sb.auth.getUser();
  if(!u) return alert("Connexion requise");

  const {data:p}=await sb.from("profiles")
    .select("prenom,nom,surns,fams,promo")
    .eq("id",u.id).single();

  if(!p) return alert("Profil incomplet");

  if(!$("title").value||!$("price").value||!$("contact").value)
    return alert("Champs obligatoires manquants");

  const imgs=[];
  for(const f of $("images").files){
    const path=`public/${Date.now()}-${f.name.replace(/\W/g,"_")}`;
    await sb.storage.from("ads-images").upload(path,f);
    imgs.push(sb.storage.from("ads-images").getPublicUrl(path).data.publicUrl);
  }

  const payload={
    owner:u.id,
    type:$("type").value,
    title:$("title").value,
    description:$("description").value||null,
    price:Number($("price").value),
    contact:$("contact").value,
    surface:Number($("surface")?.value)||null,
    rooms:Number($("rooms")?.value)||null,
    state:$("state")?.value||null,
    location:$("location")?.value||null,
    images:imgs,
    seller_name:`${p.prenom} ${p.nom}`,
    seller_bucque:`${p.surns||""} ${p.fams||""} ${p.promo||""}`.trim()
  };

  editId
    ? await sb.from("ads").update(payload).eq("id",editId)
    : await sb.from("ads").insert(payload);

  closeModal();loadAds();
};

window.loadAds=async()=>{
  let q=sb.from("ads").select("*").order("created_at",{ascending:false});
  if(currentTab==="mine"&&user) q=q.eq("owner",user.id);
  const {data}=await q;

  $("ads").innerHTML="";
  if(!data?.length){$("ads").innerHTML="<i>Aucune annonce</i>";return;}

  data.forEach(a=>{
    const wa=`https://wa.me/${a.contact.replace(/\D/g,"")}`;
    $("ads").innerHTML+=`
    <div class="card">
      <div>
        <div class="price">${a.price} €</div>
        <b>${a.title}</b>
        <div class="meta">Vendeur : ${a.seller_name} · ${a.seller_bucque}</div>
        <p>${a.description||""}</p>
        <a href="${wa}" target="_blank">📲 Contactez-moi</a>
        ${!isAdmin&&user?.id===a.owner?`
        <div class="actions">
          <button onclick="editId=${a.id};openModal()">✏️ Modifier</button>
          <button class="danger" onclick="deleteAd(${a.id})">🗑️ Supprimer</button>
        </div>`:""}
      </div>
      ${a.images?.[0]?`<img src="${a.images[0]}" onclick="showImg('${a.images[0]}')">`:""}
    </div>`;
  });
};

window.deleteAd=async id=>{
  if(confirm("Supprimer cette annonce ?")){
    await sb.from("ads").delete().eq("id",id);
    loadAds();
  }
};

window.showImg=src=>{
  $("galleryImg").src=src;
  $("gallery").style.display="flex";
};

$("filterType").onchange=$("filterSeen").onchange=loadAds;
updateFields();loadAds();
</script>

</body>
</html>
