<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le bon Coin² – Blablac'Arts</title>

<style>
body{
  margin:0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(180deg,#1b2340,#11162a);
  color:#f0f0f0;
}

h1{
  text-align:center;
  padding:30px;
  font-size:2.2em;
  letter-spacing:1px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.block{
  background: rgba(255,255,255,0.06);
  border-radius:16px;
  padding:25px;
  margin-bottom:25px;
  box-shadow: inset 0 0 40px rgba(255,255,255,0.03);
}

.block h2{ margin-top:0; }

.btn{
  background:#ffd76a;
  color:#000;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn.secondary{
  background:#2b3150;
  color:white;
}

input,select,textarea{
  width:100%;
  margin:6px 0;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#2b3150;
  color:white;
}

.card{
  background:#222a4a;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
}

.price{
  color:#7dffb3;
  font-weight:bold;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#1f2545;
  border-radius:16px;
  padding:25px;
  width:380px;
}
</style>
</head>

<body>

<h1>Blablac'Arts — Le bon Coin²</h1>

<div class="container">

  <div class="block" style="text-align:center">
    <button class="btn" onclick="openModal()">➕ Publier une annonce</button>
  </div>

  <div class="block">
    <h2>Rechercher une annonce</h2>

    <select id="filterType" onchange="loadAds()">
      <option value="">Toutes catégories</option>
      <option value="kgibs">🏠 Kgib’s</option>
      <option value="objets">📦 Objets</option>
      <option value="tech">💻 Tech</option>
      <option value="services">🛠️ Services</option>
      <option value="art">🎨 Art</option>
      <option value="autre">✨ Autre</option>
    </select>

    <input id="search" placeholder="Recherche libre..." oninput="loadAds()">
  </div>

  <div class="block">
    <div id="ads">Chargement...</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Nouvelle annonce</h2>

    <select id="type">
      <option value="kgibs">🏠 Kgib’s</option>
      <option value="objets">📦 Objets</option>
      <option value="tech">💻 Tech</option>
      <option value="services">🛠️ Services</option>
      <option value="art">🎨 Art</option>
      <option value="autre">✨ Autre</option>
    </select>

    <input id="title" placeholder="Titre">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="price" type="number" placeholder="Prix (€)">
    <input id="location" placeholder="Localisation">
    <input id="surface" placeholder="Surface (Kgib’s)">
    <input id="rooms" placeholder="Pièces">

    <button class="btn" onclick="publish()">Publier</button>
    <button class="btn secondary" onclick="closeModal()">Annuler</button>
  </div>
</div>

<!-- =========================
     SCRIPT UNIQUE (ESM)
========================= -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2"

/* SUPABASE */
const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
)

let user = null

/* GLOBAL FUNCTIONS */
window.openModal = () => modal.style.display = "flex"
window.closeModal = () => modal.style.display = "none"

window.publish = async () => {
  if(!user) return alert("Connexion requise")

  await sb.from("ads").insert({
    owner: user.id,
    type: type.value,
    title: title.value,
    description: description.value,
    price: price.value,
    location: location.value,
    surface: surface.value || null,
    rooms: rooms.value || null
  })

  closeModal()
}

window.loadAds = async () => {
  let q = sb.from("ads").select("*").order("created_at",{ascending:false})

  if(filterType.value) q = q.eq("type", filterType.value)
  if(search.value) q = q.ilike("title", `%${search.value}%`)

  const { data } = await q
  ads.innerHTML = data.length ? "" : "Aucune annonce."

  data.forEach(a=>{
    ads.innerHTML += `
      <div class="card">
        <b>${a.title}</b><br>
        <span class="price">${a.price} €</span><br>
        ${a.description || ""}<br>
        ${a.location || ""}
      </div>
    `
  })
}

/* INIT */
const init = async () => {
  const { data } = await sb.auth.getUser()
  user = data.user
  loadAds()

  sb.channel("ads")
    .on("postgres_changes",{event:"*",schema:"public",table:"ads"},loadAds)
    .subscribe()
}

init()
</script>

</body>
</html>
