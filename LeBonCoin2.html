<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Blablac'Arts — Le Bon Coin²</title>

<style>
:root{
  --main:#1b2340;
  --accent:#ffd76a;
  --bg:#eef1f5;
  --card:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,.12);
  --soft:0 4px 12px rgba(0,0,0,.08);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:#222;
}

header{
  background:linear-gradient(135deg,var(--main),#2b3150);
  color:var(--accent);
  padding:20px;
  text-align:center;
  font-size:1.9em;
  font-weight:900;
  letter-spacing:.5px;
  box-shadow:var(--shadow);
}

.container{max-width:1200px;margin:auto;padding:20px}

button{
  background:var(--accent);
  border:none;
  padding:8px 14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}
button.secondary{background:#2b3150;color:white}
button.icon{padding:6px 10px}
button:hover{transform:translateY(-2px);box-shadow:var(--soft)}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.tabs button.active{
  background:var(--main);
  color:white;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 260px;
  gap:18px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  transition:.3s;
  animation:fadeIn .4s ease;
}
.card:hover{transform:translateY(-5px)}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
}

.price{font-size:1.6em;font-weight:900;color:var(--main)}
.meta{font-size:.85em;opacity:.7}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.badges{
  display:flex;
  gap:8px;
  margin:8px 0;
}

.badge{
  font-size:.8em;
  padding:4px 8px;
  border-radius:999px;
  background:#eee;
}

.modal,.gallery{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.modal-content{
  background:white;
  padding:22px;
  border-radius:18px;
  width:440px;
  max-height:90vh;
  overflow:auto;
}

input,select,textarea{
  width:100%;
  padding:8px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

.gallery-content{
  position:relative;
}
.gallery-content img{
  max-width:85vw;
  max-height:85vh;
  border-radius:16px;
}
.gallery-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
  user-select:none;
}
.gallery-nav.left{left:-60px}
.gallery-nav.right{right:-60px}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:30px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>
<header>Blablac'Arts — Le Bon Coin²</header>

<div class="container">

<div class="tabs">
  <button id="tab-all" class="active" onclick="setTab('all')">📢 Annonces</button>
  <button id="tab-fav" onclick="setTab('fav')">⭐ Favoris</button>
  <button id="tab-mine" onclick="setTab('mine')">📂 Mes annonces</button>
  <button onclick="openModal()">➕ Publier</button>
  <button class="secondary" onclick="adminLogin()">Admin</button>
</div>

<div class="filters">
  <select id="filterType"></select>
  <select id="filterSeen">
    <option value="">Toutes</option>
    <option value="unseen">Uniquement non vues</option>
  </select>
</div>

<div id="ads">Chargement…</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Annonce</h3>
    <select id="type"></select>
    <input id="title" placeholder="Titre *">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="price" type="number" placeholder="Prix € *">
    <input id="contact" placeholder="WhatsApp *">
    <div id="dynamic"></div>
    <input type="file" id="images" multiple accept="image/*">
    <button onclick="publish()">Publier</button>
    <button class="secondary" onclick="closeModal()">Annuler</button>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery">
  <span class="close" onclick="closeGallery()">✕</span>
  <div class="gallery-content">
    <span class="gallery-nav left" onclick="prevImg()">‹</span>
    <img id="galleryImg">
    <span class="gallery-nav right" onclick="nextImg()">›</span>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
);

const $=id=>document.getElementById(id);

let user=null,isAdmin=false,currentTab="all";
let galleryImgs=[],galleryIndex=0;

sb.auth.getUser().then(r=>user=r.data.user);

const CATS=[
  ["kgibs","🏠 Kgib’s"],
  ["objets","📦 Objets"],
  ["tech","💻 Tech"],
  ["services","🛠️ Services"],
  ["art","🎨 Art"],
  ["autre","✨ Autre"]
];

CATS.forEach(c=>{
  $("type").innerHTML+=`<option value="${c[0]}">${c[1]}</option>`;
  $("filterType").innerHTML+=`<option value="${c[0]}">${c[1]}</option>`;
});

window.adminLogin=()=>{
  if(prompt("Mot de passe admin")==="Error404trads"){
    isAdmin=true;
    alert("Mode admin activé");
    loadAds();
  }
};

window.setTab=tab=>{
  currentTab=tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  $("tab-"+tab).classList.add("active");
  loadAds();
};

window.openModal=()=>{$("modal").style.display="flex"};
window.closeModal=()=>{$("modal").style.display="none"};

window.publish=async()=>{
  const {data:{user:u}}=await sb.auth.getUser();
  if(!u) return alert("Connexion requise");

  const imgs=[];
  for(const f of $("images").files){
    const path=`public/${Date.now()}-${f.name}`;
    await sb.storage.from("ads-images").upload(path,f);
    imgs.push(sb.storage.from("ads-images").getPublicUrl(path).data.publicUrl);
  }

  await sb.from("ads").insert({
    owner:u.id,
    type:$("type").value,
    title:$("title").value,
    description:$("description").value,
    price:Number($("price").value),
    contact:$("contact").value,
    images:imgs
  });

  closeModal();
  loadAds();
};

window.loadAds=async()=>{
  let q=sb.from("ads").select("*");

  if(currentTab==="mine" && user) q=q.eq("owner",user.id);
  if(currentTab==="fav" && user){
    const {data:favs}=await sb.from("ads_favorites").select("ad_id");
    q=q.in("id",favs.map(f=>f.ad_id));
  }

  const {data}=await q.order("created_at",{ascending:false});
  $("ads").innerHTML="";

  if(!data?.length){$("ads").innerHTML="<i>Aucune annonce</i>";return;}

  data.forEach(a=>{
    $("ads").innerHTML+=`
    <div class="card">
      <div>
        <div class="price">${a.price} €</div>
        <b>${a.title}</b>
        <div class="meta">${a.seller_name||""}</div>
        <p>${a.description||""}</p>
        <div class="actions">
          <button onclick="toggleFav(${a.id})">⭐</button>
          <button onclick="markSeen(${a.id})">👁️ Vu</button>
        </div>
      </div>
      ${a.images?.[0]?`<img src="${a.images[0]}" onclick="openGallery(${JSON.stringify(a.images)})">`:""}
    </div>`;
  });
};

window.toggleFav=async id=>{
  if(!user) return alert("Connexion requise");
  const {data}=await sb.from("ads_favorites").select("*").eq("ad_id",id).eq("user_id",user.id);
  data.length
    ? sb.from("ads_favorites").delete().eq("ad_id",id)
    : sb.from("ads_favorites").insert({ad_id:id,user_id:user.id});
};

window.markSeen=id=>{
  if(!user) return;
  sb.from("ads_seen").insert({ad_id:id,user_id:user.id});
};

window.openGallery=imgs=>{
  galleryImgs=imgs;
  galleryIndex=0;
  $("galleryImg").src=galleryImgs[0];
  $("gallery").style.display="flex";
};
window.closeGallery=()=>{$("gallery").style.display="none"};
window.prevImg=()=>{$("galleryImg").src=galleryImgs[galleryIndex=(galleryIndex-1+galleryImgs.length)%galleryImgs.length]};
window.nextImg=()=>{$("galleryImg").src=galleryImgs[galleryIndex=(galleryIndex+1)%galleryImgs.length]};

loadAds();
</script>
</body>
</html>
