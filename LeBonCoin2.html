<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Blablac'Arts — Le Bon Coin²</title>

<style>
:root{
  --main:#1b2340;
  --accent:#ffd76a;
  --bg:#eef1f5;
  --card:#fff;
  --shadow:0 10px 30px rgba(0,0,0,.12);
  --soft:0 4px 12px rgba(0,0,0,.08);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
}

header{
  background:linear-gradient(135deg,var(--main),#2b3150);
  color:var(--accent);
  padding:20px;
  text-align:center;
  font-size:1.9em;
  font-weight:900;
}

.container{max-width:1200px;margin:auto;padding:20px}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tabs button.active{background:var(--main);color:#fff}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
select,input,textarea{
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
  width:100%;
}

/* ---------- CARD ---------- */
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 260px;
  gap:18px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
  transition:.3s;
}
.card:hover{transform:translateY(-5px)}

.card img{
  width:100%;
  height:180px;
  object-fit:contain;
  border-radius:14px;
  cursor:pointer;
}

/* ---------- PRICE BADGE ---------- */
.price{
  display:inline-block;
  background:repeating-linear-gradient(
    45deg,
    #ffd76a,
    #ffd76a 10px,
    #ffefad 10px,
    #ffefad 20px
  );
  color:#1b2340;
  font-weight:900;
  font-size:1.6em;
  padding:6px 14px;
  border-radius:999px;
  margin-bottom:6px;
}

/* ---------- META ---------- */
.meta{
  font-size:.85em;
  opacity:.75;
  margin-bottom:8px;
}

/* ---------- BUTTONS ---------- */
button{
  background:var(--accent);
  border:none;
  padding:7px 14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
button.secondary{background:#2b3150;color:#fff}
button.icon{padding:6px 10px}

/* ---------- ACTIONS ---------- */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ---------- MODAL ---------- */
.modal,.gallery{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.modal-content{
  background:#fff;
  padding:22px;
  border-radius:18px;
  width:440px;
  max-height:90vh;
  overflow:auto;
}

/* ---------- GALLERY ---------- */
.gallery img{
  max-width:90vw;
  max-height:75vh;
  object-fit:contain;
  background:#000;
  padding:10px;
}
.gallery-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:42px;
  color:#fff;
  cursor:pointer;
}
.gallery-nav.left{left:40px}
.gallery-nav.right{right:40px}
.close{position:absolute;top:20px;right:30px;font-size:30px;color:#fff;cursor:pointer}

/* ================= MOBILE ================= */
@media (max-width: 900px){

  .profile-box{
    display:block;
    color:#111;
    flex-direction:column;
    gap:2px;
    background:#e8ebf0;
  }
  
  .container{
    padding:12px;
  }

  .tabs{
    gap:6px;
  }

  /* bouton publier bien séparé */
  .tabs button:last-child{
    margin-left:auto;
    background:#ffb703;
  }

  .card{
    grid-template-columns:1fr;
  }

  .card img{
  height:180px;
  object-fit:contain;
  background:#000;
  padding:6px;
}

  .price{
    font-size:1.4em;
  }

  .actions{
    justify-content:space-between;
  }

  .meta{
    font-size:.9em;
    line-height:1.3;
  }

  .modal-content{
    width:95%;
  }
}

.icon-heart{
  font-size:20px;
  cursor:pointer;
}
.icon-heart.active{
  color:red;
}
.icon-eye{
  opacity:.5;
}
.icon-eye.active{
  opacity:1;
}

  .profile-box{
  background:#f3f4f6;
  padding:8px 12px;
  border-radius:12px;
  margin:8px 0;
  font-size:.9em;
}

.gallery{
  backdrop-filter: blur(14px);
}

.gallery img{
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

#thumbs{
  position:absolute;
  bottom:25px;
  width:100%;
}
  
#thumbs img:hover{
  transform: scale(1.05);
  opacity:1 !important;
}

.card.unseen{
  box-shadow:0 0 0 3px #ff9f1c, var(--shadow);
  background:linear-gradient(0deg,#fff,#fff8e6);
}
  
</style>
</head>

<body>

<header>Blablac'Arts — Le Bon Coin²</header>

<div class="container">

<div class="tabs">
  <button id="tab-all" class="active" onclick="setTab('all')">📢 Annonces</button>
  <button id="tab-fav" onclick="setTab('fav')">⭐ Favoris</button>
  <button id="tab-mine" onclick="setTab('mine')">📂 Mes annonces</button>
  <button onclick="openModal()">➕ Publier</button>
  <button onclick="adminLogin()">🛡 Admin</button>
</div>

<div class="filters">
  <select id="filterType"><option value="">Toutes catégories</option></select>
  <select id="filterSeen">
    <option value="">Toutes</option>
    <option value="unseen">Uniquement non vues</option>
  </select>
</div>

<div id="ads">Chargement…</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Publier une annonce</h3>

    <select id="type" onchange="updateForm()"></select>

    <input id="title" placeholder="Titre *">
    <textarea id="description" placeholder="Description (facultatif)"></textarea>

    <div id="kgibsFields" style="display:none">
      <input id="location" placeholder="Localisation *">
      <input id="places" type="number" placeholder="Nombre de places *">
    </div>

    <div id="otherFields" style="display:none">
      <input id="state" placeholder="État *">
    </div>

    <input id="price" type="number" placeholder="Prix € *">
    <input id="contact" placeholder="Numéro WhatsApp *">

    <input type="file" id="images" multiple accept="image/*"><br><br>

    <button onclick="publish()">Publier</button>
    <button class="secondary" onclick="closeModal()">Annuler</button>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery">
  <span class="close" onclick="closeGallery()">✕</span>
  <span class="gallery-nav left" onclick="prevImg()">‹</span>
  <img id="galleryImg">
    <div id="thumbs"
         style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
    </div>
  <span class="gallery-nav right" onclick="nextImg()">›</span>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
);

const $ = id => document.getElementById(id);
let loadingAds = false;
let user=null,currentTab="all";
let galleryImgs=[],galleryIndex=0;
window.__ADS_CACHE = {};

let isAdmin = false;
let ADS_IMAGES = {};
  
async function initAuth(){
  const { data } = await sb.auth.getSession();
  user = data.session?.user || null;
  await loadAds();
}

sb.auth.onAuthStateChange((_e, session)=>{
  const wasLogged = !!user;
  user = session?.user || null;
  if (wasLogged !== !!user) loadAds();
});

initAuth();

window.deleteAd = async function(id){
  if(!confirm("Supprimer cette annonce ?")) return;

  const { error } = await sb
    .from("ads")
    .delete()
    .eq("id", id);

  if (error) {
    alert("Suppression refusée");
    console.error(error);
    return;
  }

  // ✅ suppression immédiate côté UI
  delete window.__ADS_CACHE[id];
  loadAds();
};

window.editAd = function(ad){
  openModal();
  $("type").value = ad.type;
  $("title").value = ad.title;
  $("description").value = ad.description||"";
  $("price").value = ad.price;
  $("contact").value = ad.contact||"";
  $("location").value = ad.location||"";
  $("places").value = ad.rooms||"";
  $("state").value = ad.state||"";

  window.__editId = ad.id;
}

const CATS=[
 ["kgibs","🏠 Kgib’s"],
 ["objets","📦 Objets"],
 ["tech","💻 Tech"],
 ["services","🛠️ Services"],
 ["art","🎨 Art"],
 ["autre","✨ Autre"]
];
CATS.forEach(c=>{
  $("type").innerHTML+=`<option value="${c[0]}">${c[1]}</option>`;
  $("filterType").innerHTML+=`<option value="${c[0]}">${c[1]}</option>`;
});

window.updateForm=()=>{
  const isKgibs=$("type").value==="kgibs";
  $("kgibsFields").style.display=isKgibs?"block":"none";
  $("otherFields").style.display=!isKgibs?"block":"none";
};

window.openModal=()=>{$("modal").style.display="flex";updateForm()}
window.closeModal=()=>{$("modal").style.display="none"}

window.adminLogin = () => {
  const code = prompt("Code admin ?");
  if (code === "Error404trads") {
    isAdmin = true;
    alert("Mode admin activé");
    loadAds();
  } else {
    alert("Code incorrect");
  }
};
  
window.publish = async () => {
  const { data: { user: u } } = await sb.auth.getUser();
  if (!u) {
    alert("Connexion requise");
    return;
  }

  const imgs = [];
  for (const f of $("images").files) {
    const path = `public/${Date.now()}-${f.name}`;
    await sb.storage.from("ads-images").upload(path, f);
    imgs.push(
      sb.storage.from("ads-images").getPublicUrl(path).data.publicUrl
    );
  }

  if (window.__editId) {
    await sb.from("ads").update({
      title: $("title").value,
      description: $("description").value || null,
      price: Number($("price").value),
      contact: $("contact").value,
      location: $("location")?.value || null,
      rooms: $("places")?.value || null,
      state: $("state")?.value || null,
    }).eq("id", window.__editId);

    window.__editId = null;

  } else {
    await sb.from("ads").insert({
      owner: u.id,
      type: $("type").value,
      title: $("title").value,
      description: $("description").value || null,
      price: Number($("price").value),
      contact: $("contact").value,
      location: $("location")?.value || null,
      rooms: $("places")?.value || null,
      state: $("state")?.value || null,
      images: imgs
    });
  }

    $("title").value = "";
    $("description").value = "";
    $("price").value = "";
    $("contact").value = "";
    $("location").value = "";
    $("places").value = "";
    $("state").value = "";
    $("images").value = "";

  closeModal();
  loadAds();
};

async function isFav(adId){
  if(!user) return false;

  const { data, error } = await sb
    .from("ads_favorites")
    .select("ad_id")
    .eq("user_id", user.id)
    .eq("ad_id", adId)
    .limit(1);

  if(error) return false;
  return data.length > 0;
}

async function isSeen(adId){
  if(!user) return false;

  const { data, error } = await sb
    .from("ads_seen")
    .select("ad_id")
    .eq("user_id", user.id)
    .eq("ad_id", adId)
    .limit(1);

  if(error) return false;
  return data.length > 0;
}
  
window.setTab=tab=>{
  currentTab=tab;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  $("tab-"+tab).classList.add("active");
  loadAds();
};

window.toggleFav = async (adId) => {
  await markSeen(adId);
  if (!user) {
    alert("Connexion requise pour les favoris");
    return;
  }

  const { data, error } = await sb
    .from("ads_favorites")
    .select("ad_id")
    .eq("user_id", user.id)
    .eq("ad_id", adId)
    .limit(1);

  if (error) {
    console.error("Erreur favoris:", error);
    return;
  }

  const exists = Array.isArray(data) && data.length > 0;

  if (exists) {
    await sb
      .from("ads_favorites")
      .delete()
      .eq("user_id", user.id)
      .eq("ad_id", adId);
  } else {
    await sb
      .from("ads_favorites")
      .insert({ user_id: user.id, ad_id: adId });
  }

  loadAds();
};


window.markSeen = async (adId) => {

  // =========================
  // 🔒 VISITEUR NON CONNECTÉ
  // =========================
  if (!user) {
    const key = `seen_ad_${adId}`;
    if (localStorage.getItem(key)) return;

    localStorage.setItem(key, "1");

    // vue anonyme → on incrémente quand même
    await sb.rpc("increment_ad_views", { ad_id: adId });
    return;
  }

  // =========================
  // 🔐 UTILISATEUR CONNECTÉ
  // =========================
  const { error } = await sb
    .from("ads_seen")
    .insert({ user_id: user.id, ad_id: adId });

  if (error) {
    if (error.code === "23505") return; // déjà vu
    console.error(error);
    return;
  }

  await sb.rpc("increment_ad_views", { ad_id: adId });
};


window.loadAds = async () => {
  if (loadingAds) return;
  loadingAds = true;

  ADS_IMAGES = {};
  let q = sb.from("ads").select("*");

  if(currentTab==="mine" && user) q = q.eq("owner", user.id);
  if(currentTab==="fav" && user){
    const { data: favs } = await sb.from("ads_favorites").select("ad_id");
    q = q.in("id", favs.map(f => f.ad_id));
  }
  if ($("filterType").value) q = q.eq("type", $("filterType").value);

  const { data } = await q.order("created_at", { ascending:false });
  $("ads").innerHTML = "";

  for (const a of data) {

    // ✅ CORRECTION ICI (a existe maintenant)
    window.__ADS_CACHE[a.id] = a;

    const { data: p } = await sb
      .from("profiles")
      .select("prenom,nom,surns,fams,promo")
      .eq("id", a.owner)
      .single();

    const wa = `https://wa.me/${(a.contact || "").replace(/\D/g,"")}`;
    const fav = await isFav(a.id);
    const seen = await isSeen(a.id);

    if (a.images?.length) {
      ADS_IMAGES[a.id] = a.images;
    }

    $("ads").innerHTML += `
      <div class="card ${seen ? "" : "unseen"}">
        <div>
          <div class="price">${a.price} €</div>
          <b>${a.title}</b>

          <div class="profile-box">
            👤 ${p?.prenom || ""} ${p?.nom || ""}<br>
            <small>
              ${p?.surns || ""} ${p?.fams || ""} ${p?.promo || ""}
            </small>
          </div>

          <p>${a.description || ""}</p>

          <div class="meta">
            ${a.location ? `📍 ${a.location}<br>` : ""}
            ${a.rooms ? `👥 ${a.rooms} places<br>` : ""}
            ${a.state ? `📦 État : ${a.state}<br>` : ""}
            🗂 Catégorie : ${a.type}
          </div>

          <div class="actions">
            ${(currentTab === "mine" || isAdmin) ? `
              <button class="secondary" onclick="editAdById(${a.id})">✏️ Modifier</button>
              <button class="secondary" onclick="deleteAd(${a.id})">🗑 Supprimer</button>
            ` : ""}

            <a href="${wa}" target="_blank" onclick="markSeen(${a.id})">
              <button>📲 Contactez-moi</button>
            </a>

            <span class="icon-heart ${fav ? "active" : ""}"
                  onclick="toggleFav(${a.id})">
              ${fav ? "❤️" : "🤍"}
            </span>

            <span class="icon-eye ${seen ? "active" : ""}"
                  title="${a.views || 0} vues">
              👁 ${a.views || 0}
            </span>
          </div>
        </div>

        ${a.images?.[0]
          ? `<img src="${a.images[0]}" onclick="openGalleryById(${a.id})">`
          : ""
        }
      </div>`;
  }

  loadingAds = false;
};

window.editAdById = (id) => {
  const ad = window.__ADS_CACHE[id];
  if (!ad) return;
  editAd(ad);
};
  
window.openGalleryById = async (adId) => {
  await markSeen(adId);
  openGallery(ADS_IMAGES[adId]);
};
  
window.openGallery = (imgs) => {
  galleryImgs = imgs;
  galleryIndex = 0;

  $("galleryImg").src = galleryImgs[0];
  $("thumbs").innerHTML = "";

  galleryImgs.forEach((src, i) => {
    const t = document.createElement("img");
    t.src = src;
    t.style.height = "55px";
    t.style.borderRadius = "8px";
    t.style.cursor = "pointer";
    t.style.opacity = i === 0 ? "1" : ".6";

    t.onclick = () => {
      galleryIndex = i;
      $("galleryImg").src = src;
      [...$("thumbs").children].forEach(c => c.style.opacity = ".6");
      t.style.opacity = "1";
    };

    $("thumbs").appendChild(t);
  });

  $("gallery").style.display = "flex";
};

window.closeGallery=()=>{$("gallery").style.display="none"};
window.prevImg = () => {
  galleryIndex = (galleryIndex - 1 + galleryImgs.length) % galleryImgs.length;
  $("galleryImg").src = galleryImgs[galleryIndex];
};

window.nextImg = () => {
  galleryIndex = (galleryIndex + 1) % galleryImgs.length;
  $("galleryImg").src = galleryImgs[galleryIndex];
};

$("filterType").onchange=loadAds;
$("filterSeen").onchange=loadAds;

</script>

</body>
</html>
