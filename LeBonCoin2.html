<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le bon Coin²</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#eee;padding:20px}
input,select,textarea,button{margin:5px;padding:6px}
.card{border:1px solid #444;padding:10px;margin:10px 0}
.mine{border-color:#00ffaa}
</style>
</head>

<body>

<h1>🟦 Le bon Coin²</h1>

<!-- FORMULAIRE -->
<h2>➕ Publier une annonce</h2>
<select id="type">
  <option value="objet">Objet</option>
  <option value="maison">Maison</option>
  <option value="autre">Autre</option>
</select><br>

<input id="title" placeholder="Titre"><br>
<textarea id="description" placeholder="Description"></textarea><br>
<input id="price" type="number" placeholder="Prix (€)"><br>
<input id="location" placeholder="Localisation"><br>

<input id="surface" type="number" placeholder="Surface (maison)">
<input id="rooms" type="number" placeholder="Pièces (maison)"><br>

<button onclick="publish()">Publier</button>

<hr>

<!-- FILTRE -->
<h2>🔍 Recherche</h2>
<select id="filterType" onchange="loadAds()">
  <option value="">Tous</option>
  <option value="objet">Objet</option>
  <option value="maison">Maison</option>
  <option value="autre">Autre</option>
</select>

<input id="search" placeholder="Recherche..." oninput="loadAds()">

<hr>

<!-- LISTE -->
<div id="ads"></div>

<script>
const supabase = supabase.createClient(
  "https://TON-PROJET.supabase.co",
  "PUBLIC-ANON-KEY"
)

let user = null

async function init(){
  const { data } = await supabase.auth.getUser()
  user = data.user
  loadAds()

  supabase.channel('ads')
    .on('postgres_changes',{event:'*',schema:'public',table:'ads'},loadAds)
    .subscribe()
}

async function publish(){
  if(!user) return alert("Non connecté")

  await supabase.from('ads').insert({
    owner: user.id,
    type: type.value,
    title: title.value,
    description: description.value,
    price: price.value,
    location: location.value,
    surface: surface.value || null,
    rooms: rooms.value || null
  })

  title.value = description.value = price.value = ''
}

async function loadAds(){
  let q = supabase.from('ads').select('*').order('created_at',{ascending:false})

  if(filterType.value)
    q = q.eq('type',filterType.value)

  if(search.value)
    q = q.ilike('title',`%${search.value}%`)

  const { data } = await q

  ads.innerHTML = ''
  data.forEach(a=>{
    ads.innerHTML += `
      <div class="card ${user && a.owner===user.id?'mine':''}">
        <b>${a.title}</b> (${a.type}) – ${a.price}€<br>
        ${a.description || ''}<br>
        ${a.location || ''}
        ${a.surface?`<br>🏠 ${a.surface}m² - ${a.rooms} pièces`:''}
        ${user && a.owner===user.id?
          `<br><button onclick="del(${a.id})">Supprimer</button>`:''
        }
      </div>
    `
  })
}

async function del(id){
  await supabase.from('ads').delete().eq('id',id)
}

init()
</script>

</body>
</html>
