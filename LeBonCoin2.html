<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Le bon Coin² – Blablac'Arts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --violet:#6b3cff;
  --violet-glow:#9f7bff;
  --bg:#120022;
  --card:#1d0935;
  --text:#eee;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:radial-gradient(circle at top,var(--violet),#120022 60%);
  color:var(--text);
  min-height:100vh;
}

h1{
  text-align:center;
  padding:30px;
  font-size:2.5em;
  text-shadow:0 0 15px var(--violet-glow);
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

select,input{
  background:#2a0f4a;
  color:white;
  border:1px solid var(--violet);
  padding:8px;
  border-radius:6px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 0 15px rgba(0,0,0,.5);
  border:1px solid transparent;
}

.card.mine{
  border-color:var(--violet-glow);
}

.price{
  color:#00ffcc;
  font-weight:bold;
}

.btn{
  background:var(--violet);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  box-shadow:0 0 10px var(--violet-glow);
}

.btn:hover{
  filter:brightness(1.2);
}

/* Bouton flottant */
.publish-btn{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  font-size:30px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:#1d0935;
  padding:20px;
  border-radius:12px;
  width:350px;
  box-shadow:0 0 25px var(--violet-glow);
}

.modal-content h2{
  text-align:center;
}

.modal-content input,
.modal-content textarea,
.modal-content select{
  width:100%;
  margin-bottom:10px;
}

.close{
  float:right;
  cursor:pointer;
  color:#aaa;
}
</style>
</head>

<body>

<h1>🟣 Le bon Coin²</h1>

<div class="container">

  <div class="filters">
    <select id="filterType" onchange="loadAds()">
      <option value="">Toutes catégories</option>
      <option value="kgibs">🏠 Kgib’s</option>
      <option value="objets">📦 Objets</option>
      <option value="tech">💻 Tech</option>
      <option value="services">🛠️ Services</option>
      <option value="art">🎨 Art</option>
      <option value="autre">✨ Autre</option>
    </select>

    <input id="search" placeholder="Recherche..." oninput="loadAds()">
  </div>

  <div id="ads"></div>
</div>

<button class="btn publish-btn" onclick="openModal()">＋</button>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <h2>Nouvelle annonce</h2>

    <select id="type">
      <option value="kgibs">🏠 Kgib’s</option>
      <option value="objets">📦 Objets</option>
      <option value="tech">💻 Tech</option>
      <option value="services">🛠️ Services</option>
      <option value="art">🎨 Art</option>
      <option value="autre">✨ Autre</option>
    </select>

    <input id="title" placeholder="Titre">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="price" type="number" placeholder="Prix (€)">
    <input id="location" placeholder="Localisation">
    <input id="surface" type="number" placeholder="Surface (Kgib’s)">
    <input id="rooms" type="number" placeholder="Pièces (Kgib’s)">

    <button class="btn" onclick="publish()">Publier</button>
  </div>
</div>

<script>
const supabase = supabase.createClient(
  "https://TON-PROJET.supabase.co",
  "PUBLIC-ANON-KEY"
)

let user = null

async function init(){
  user = (await supabase.auth.getUser()).data.user
  loadAds()

  supabase.channel('ads')
    .on('postgres_changes',{event:'*',schema:'public',table:'ads'},loadAds)
    .subscribe()
}

function openModal(){ modal.style.display='flex' }
function closeModal(){ modal.style.display='none' }

async function publish(){
  if(!user) return alert("Connexion requise")

  await supabase.from('ads').insert({
    owner:user.id,
    type:type.value,
    title:title.value,
    description:description.value,
    price:price.value,
    location:location.value,
    surface:surface.value||null,
    rooms:rooms.value||null
  })

  closeModal()
}

async function loadAds(){
  let q = supabase.from('ads').select('*').order('created_at',{ascending:false})

  if(filterType.value) q = q.eq('type',filterType.value)
  if(search.value) q = q.ilike('title',`%${search.value}%`)

  const { data } = await q
  ads.innerHTML=''

  data.forEach(a=>{
    ads.innerHTML+=`
      <div class="card ${user&&a.owner===user.id?'mine':''}">
        <b>${a.title}</b><br>
        <span class="price">${a.price} €</span><br>
        ${a.description||''}<br>
        ${a.location||''}
        ${a.surface?`<br>🏠 ${a.surface} m² - ${a.rooms} pièces`:''}
        ${user&&a.owner===user.id?`<br><button class="btn" onclick="del(${a.id})">Supprimer</button>`:''}
      </div>`
  })
}

async function del(id){
  await supabase.from('ads').delete().eq('id',id)
}

init()
</script>

</body>
</html>
