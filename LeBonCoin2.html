<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Blablac'Arts — Le bon Coin²</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#eef1f5;
  color:#222
}
header{
  background:linear-gradient(135deg,#1b2340,#2b3150);
  color:#ffd76a;
  padding:18px;
  text-align:center;
  font-size:1.9em;
  font-weight:bold
}
.container{max-width:1100px;margin:auto;padding:20px}
.btn{
  background:#ffd76a;
  border:none;
  padding:8px 14px;
  font-weight:bold;
  cursor:pointer;
  border-radius:6px;
  transition:.2s
}
.btn:hover{filter:brightness(.95)}
.btn.secondary{background:#2b3150;color:white}
.btn.danger{background:#d9534f;color:white}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.card{
  background:white;
  border-radius:10px;
  padding:15px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  gap:18px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  transition:.2s
}
.card:hover{transform:translateY(-2px)}

.card-left{flex:1}
.card-right img{
  width:190px;
  height:140px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer
}

.price{
  color:#1b2340;
  font-weight:bold;
  font-size:1.25em
}
.contact a{
  display:inline-block;
  margin-top:6px;
  color:#2b3150;
  font-weight:bold;
  text-decoration:none
}
.contact a:hover{text-decoration:underline}

.actions{
  margin-top:10px;
  display:flex;
  gap:8px
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10
}
.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:420px
}
input,select,textarea{
  width:100%;
  padding:8px;
  margin:6px 0
}

.gallery-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20
}
.gallery{
  background:#111;
  padding:10px;
  border-radius:10px
}
.gallery img{
  max-width:80vw;
  max-height:70vh;
  display:block;
  margin:auto
}
.thumbs{
  display:flex;
  gap:6px;
  margin-top:8px;
  justify-content:center
}
.thumbs img{
  width:50px;
  height:40px;
  object-fit:cover;
  cursor:pointer;
  opacity:.7
}
.thumbs img.active{
  opacity:1;
  border:2px solid #ffd76a
}
.close{
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:28px;
  cursor:pointer
}
.arrow{
  position:absolute;
  top:50%;
  font-size:40px;
  color:white;
  cursor:pointer;
  user-select:none
}
.arrow.left{left:20px}
.arrow.right{right:20px}
</style>
</head>

<body>

<header>Blablac'Arts — Le bon Coin²</header>

<div class="container">
  <div class="topbar">
    <button class="btn" onclick="openModal()">➕ Publier une annonce</button>
    <button class="btn secondary" onclick="adminLogin()">Admin</button>
  </div>

  <div id="ads">Chargement...</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">Nouvelle annonce</h3>

    <select id="type" onchange="updateFields()">
      <option value="kgibs">🏠 Kgib’s</option>
      <option value="objets">📦 Objets</option>
      <option value="tech">💻 Tech</option>
      <option value="services">🛠️ Services</option>
      <option value="art">🎨 Art</option>
      <option value="autre">✨ Autre</option>
    </select>

    <input id="title" placeholder="Titre *">
    <textarea id="description" placeholder="Description"></textarea>

    <input id="contact" placeholder="Contact (email ou téléphone) *">

    <div id="dynamicFields"></div>

    <input type="file" id="images" multiple accept="image/*">

    <button class="btn" onclick="publish()">Publier</button>
    <button class="btn secondary" onclick="closeModal()">Annuler</button>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery-overlay" id="gallery">
  <div class="close" onclick="closeGallery()">✕</div>
  <div class="arrow left" onclick="prevImg()">‹</div>
  <div class="arrow right" onclick="nextImg()">›</div>
  <div class="gallery">
    <img id="galleryImg">
    <div class="thumbs" id="thumbs"></div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const sb = createClient(
  "https://wwjsqkktwxciyvzoisyz.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3anNxa2t0d3hjaXl2em9pc3l6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyNTY0NzEsImV4cCI6MjA3OTgzMjQ3MX0.lBigIn0vRPEseB-iZEGfoQhi7aHaK01k2P-a88YDdCU"
);

let isAdmin=false
let editId=null
let galleryImgs=[]
let galleryIndex=0
const adminPassword="Error404trads"
const $=id=>document.getElementById(id)

window.adminLogin=()=>{
  const p=prompt("Mot de passe admin")
  if(p===adminPassword){
    isAdmin=true
    alert("Mode admin activé")
    loadAds()
  }
}

window.openModal=()=>{$("modal").style.display="flex";resetModal()}
window.closeModal=()=> $("modal").style.display="none"

function resetModal(){
  editId=null
  $("modalTitle").innerText="Nouvelle annonce"
  ["title","description","contact","images"].forEach(i=>$(i).value="")
  $("type").value="kgibs"
  updateFields()
}

window.updateFields=()=>{
  $("dynamicFields").innerHTML =
    `<input id="price" type="number" placeholder="Prix € *">` +
    ($("type").value==="kgibs"
      ? `<input id="surface" type="number" placeholder="Surface m² *">
         <input id="rooms" type="number" placeholder="Pièces *">
         <input id="location" placeholder="Localisation *">`
      : `<input id="state" placeholder="État *">`)
}

window.publish=async()=>{
  if(!$("title").value||!$("contact").value||!Number($("price").value))
    return alert("Champs obligatoires manquants")

  const urls=[]
  for(const f of $("images").files){
    const p=`public/${Date.now()}-${f.name}`
    await sb.storage.from("ads-images").upload(p,f)
    urls.push(sb.storage.from("ads-images").getPublicUrl(p).data.publicUrl)
  }

  const payload={
    type:$("type").value,
    title:$("title").value,
    description:$("description").value||null,
    price:Number($("price").value),
    contact:$("contact").value,
    surface:Number($("surface")?.value)||null,
    rooms:Number($("rooms")?.value)||null,
    state:$("state")?.value||null,
    location:$("location")?.value||null,
    images:urls
  }

  editId
    ? await sb.from("ads").update(payload).eq("id",editId)
    : await sb.from("ads").insert(payload)

  closeModal();loadAds()
}

window.loadAds=async()=>{
  const {data}=await sb.from("ads").select("*").order("created_at",{ascending:false})
  $("ads").innerHTML=""
  data?.forEach(a=>{
    const contactLink = a.contact.includes("@")
      ? `mailto:${a.contact}`
      : `https://wa.me/${a.contact.replace(/\D/g,"")}`

    $("ads").innerHTML+=`
    <div class="card">
      <div class="card-left">
        <b>${a.title}</b><br>
        <span class="price">${a.price} €</span><br>
        ${a.description||""}
        <div class="contact">
          <a href="${contactLink}" target="_blank">📞 ${a.contact}</a>
        </div>
        ${isAdmin?`
        <div class="actions">
          <button class="btn secondary" onclick="editId=${a.id};openModal()">Modifier</button>
          <button class="btn danger" onclick="deleteAd(${a.id})">Supprimer</button>
        </div>`:""}
      </div>
      ${a.images?.[0]?`<div class="card-right">
        <img src="${a.images[0]}" onclick='openGallery(${JSON.stringify(a.images)},0)'>
      </div>`:""}
    </div>`
  })
}

window.deleteAd=async id=>{
  if(confirm("Supprimer cette annonce ?")){
    await sb.from("ads").delete().eq("id",id)
    loadAds()
  }
}

window.openGallery=(imgs,i)=>{
  galleryImgs=imgs;galleryIndex=i
  $("gallery").style.display="flex";renderGallery()
}
window.closeGallery=()=> $("gallery").style.display="none"
window.prevImg=()=>{galleryIndex=(galleryIndex-1+galleryImgs.length)%galleryImgs.length;renderGallery()}
window.nextImg=()=>{galleryIndex=(galleryIndex+1)%galleryImgs.length;renderGallery()}
function renderGallery(){
  $("galleryImg").src=galleryImgs[galleryIndex]
  $("thumbs").innerHTML=""
  galleryImgs.forEach((i,idx)=>{
    $("thumbs").innerHTML+=`<img src="${i}" class="${idx===galleryIndex?"active":""}" onclick="openGallery(${JSON.stringify(galleryImgs)},${idx})">`
  })
}

updateFields();loadAds()
</script>

</body>
</html>
