<style>
:root{
  --bg:#071026;
  --card:#071627;
  --muted:#9fb3d9;
  --accent1:#60a5fa;
  --accent2:#c084fc;
  --glass:rgba(255,255,255,0.03);
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Poppins",system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,#061024 0%, #031018 100%);
  color:#e6eef8;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh;
}

/* App layout */
.app{
  display:grid;
  grid-template-columns:320px 1fr;
  gap:20px;
  padding:20px;
  width:100%;
  max-width:1400px;
  margin:20px auto;
  align-items:start;
}
.header{
  grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 8px;
}
.brand{display:flex;flex-direction:column}
.title{font-size:20px;font-weight:700;background:linear-gradient(90deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:12px;color:var(--muted)}

.sidebar{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  padding:12px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.03);
  height:calc(100vh - 140px);overflow:auto;
}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1;padding:10px;border-radius:10px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:inherit}
.searchbar select{padding:10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:inherit}

.list{display:flex;flex-direction:column;gap:10px}
.card{
  padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
  cursor:pointer;border:1px solid rgba(255,255,255,0.02);display:flex;align-items:center;gap:10px;
}
.card .info{flex:1}
.card .titleitem{font-weight:600}
.card .tags{font-size:12px;color:var(--muted)}

.player{
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  padding:18px;border-radius:var(--radius);border:1px solid rgba(255,255,255,0.03);
  min-height:420px;display:flex;flex-direction:column;gap:12px;
}
.player-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.player-controls{display:flex;align-items:center;gap:10px}
.bigplay{width:64px;height:64px;border-radius:12px;background:linear-gradient(90deg,var(--accent1),var(--accent2));display:grid;place-items:center;color:#021;cursor:pointer;border:none;font-size:20px}
.smallbtn{width:44px;height:44px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);display:grid;place-items:center;cursor:pointer}

.progress{height:10px;background:rgba(255,255,255,0.04);border-radius:999px;overflow:hidden;cursor:pointer}
.progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));transition:width 0.08s linear}
.time{font-size:13px;color:var(--muted);min-width:110px;text-align:right}

.controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.settings{display:flex;gap:8px;align-items:center}
.label{font-size:13px;color:var(--muted);margin-right:6px}

/* Lyrics panel */
.lyrics-panel{
  margin-top:6px;padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(0,0,0,0.15), rgba(255,255,255,0.01));
  flex:1;overflow:auto;border:1px solid rgba(255,255,255,0.02);
}
.lyrics .line{padding:6px 8px;border-radius:8px;margin-bottom:6px;color:var(--muted);line-height:1.45}
.lyrics .line.active{color:#fff;background:linear-gradient(90deg, rgba(96,165,250,0.06), rgba(192,132,252,0.04));box-shadow:0 6px 18px rgba(2,6,23,0.6);}

/* responsive */
@media(max-width:980px){
  .app{grid-template-columns:1fr; padding:12px}
  .sidebar{height:auto}
}
.footer{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

const listEl = document.getElementById('list');

const nowTags = document.getElementById('nowTags');

const audio = new Audio();

let currentIndex = null;

let syncMode = false;

// ====== Format temps ======
function formatTime(t){
  if(!isFinite(t)) return '00:00';
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

// ====== Liste ======
function renderList(items){
  listEl.innerHTML = '';
  items.forEach((m, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div style="width:52px;height:52px;border-radius:8px;background:linear-gradient(90deg,var(--accent1),var(--accent2));display:grid;place-items:center;font-weight:700">♪</div>
      <div class="info">
        <div class="titleitem">${m.title}</div>
        <div class="tags">${m.tags.join(' • ')}</div>
      </div>`;
    card.addEventListener('click',()=> selectAndPlay(idx));
    listEl.appendChild(card);
  });
}

// ====== Sélection + lecture ======
function selectAndPlay(index){
  const m = MONOMES[index];
  if(!m) return;
  currentIndex = index;
  audio.src = m.audio;
  audio.playbackRate = parseFloat(speedEl.value);
  audio.volume = parseFloat(volumeEl.value);
  nowTitle.textContent = m.title;
  nowTags.textContent = m.tags.join(' • ');
  loadLyrics(m.lyrics || '');
  audio.play().then(()=>btnPlay.textContent='⏸').catch(()=>{});
}

// ====== Paroles synchronisées ======
function loadLyrics(raw){
  parsedLyrics = [];
  lyricsEl.innerHTML = '';
  const lrcPattern = /^\s*\[(\d{1,2}):(\d{2})(?:\.(\d{1,2}))?\]\s*(.*)$/;
  const lines = raw.split(/\r?\n/).filter(l=>l.trim().length>0);
  let isLRC = lines.some(ln => lrcPattern.test(ln));

  if(isLRC){
    syncMode = true;
    lines.forEach(ln=>{
      const m = ln.match(lrcPattern);
      if(m){
        const time = parseInt(m[1])*60 + parseInt(m[2]) + (m[3]?parseInt(m[3]):0)/100;
        const div = document.createElement('div');
        div.className='line';
        div.dataset.time = time;
        div.textContent = m[4] || '';
        lyricsEl.appendChild(div);
        parsedLyrics.push({time, el:div});
      }
    });
    parsedLyrics.sort((a,b)=>a.time-b.time);
  } else {
    syncMode = false;
    const p = document.createElement('div');
    p.style.whiteSpace = 'pre-wrap';
    p.textContent = raw || 'Paroles indisponibles.';
    lyricsEl.appendChild(p);
  }
}

// ====== Progression + highlight ======
function updateProgress(){
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeEl.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

  if(syncMode && parsedLyrics.length){
    let activeIndex = parsedLyrics.findIndex((p, idx)=>{
      const next = parsedLyrics[idx+1];
      if(!next) return audio.currentTime >= p.time;
      return audio.currentTime >= p.time && audio.currentTime < next.time;
    });
    parsedLyrics.forEach((p, i)=>{
      p.el.classList.toggle('active', i===activeIndex);
    });
    const activeLine = parsedLyrics[activeIndex]?.el;
    if(activeLine){
      const c = lyricsEl;
      const top = activeLine.offsetTop - c.clientHeight/2 + activeLine.clientHeight/2;
      c.scrollTo({top, behavior:'smooth'});
    }
  }
}

// ====== Audio events ======
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', ()=> timeEl.textContent = `${formatTime(0)} / ${formatTime(audio.duration)}`);
audio.addEventListener('play', ()=> btnPlay.textContent = '⏸');
audio.addEventListener('pause', ()=> btnPlay.textContent = '▶');
audio.addEventListener('ended', ()=> nextTrack());

// ====== Boutons principaux ======
btnPlay.addEventListener('click', ()=>{
  if(!audio.src && MONOMES.length>0){ selectAndPlay(0); return; }
  if(audio.paused) audio.play(); else audio.pause();
});

btnPrev.addEventListener('click', prevTrack);
btnNext.addEventListener('click', nextTrack);

function prevTrack(){
  if(currentIndex===null) return;
  const newIndex = (currentIndex - 1 + MONOMES.length) % MONOMES.length;
  selectAndPlay(newIndex);
}
function nextTrack(){
  if(currentIndex===null) return;
  const newIndex = (currentIndex + 1) % MONOMES.length;
  selectAndPlay(newIndex);
}

// ====== Divers contrôles ======
speedEl.addEventListener('change', ()=> audio.playbackRate = parseFloat(speedEl.value));
volumeEl.addEventListener('input', ()=> audio.volume = parseFloat(volumeEl.value));

toggleLyricsBtn.addEventListener('click', ()=>{
  lyricsPanel.style.display = (lyricsPanel.style.display === 'none') ? 'block' : 'none';
});
fullscreenBtn.addEventListener('click', ()=>{
  const el = document.documentElement;
  if(!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
});

progressBar.addEventListener('click', e=>{
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(audio.duration) audio.currentTime = pct * audio.duration;
});

// ====== Espace = lecture/pause ======
window.addEventListener('keydown', e=>{
  if(['input','textarea','select'].includes(document.activeElement.tagName.toLowerCase())) return;
  if(e.key === ' '){
    e.preventDefault();
    if(audio.paused) audio.play(); else audio.pause();
  }
});

// ====== Recherche / filtre ======
function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  const f = filterEl.value;
  const filtered = MONOMES.filter(m=>{
    if(f !== 'all' && !m.tags.includes(f)) return false;
    if(!q) return true;
    return m.title.toLowerCase().includes(q) || (m.lyrics||'').toLowerCase().includes(q);
  });
  renderList(filtered);
}

searchInput.addEventListener('input', applyFilters);
filterEl.addEventListener('change', applyFilters);

// ====== Initialisation ======
renderList(MONOMES);
applyFilters();
audio.volume = 0.9;
speedEl.value = 1;
</script>

</body>
</html>
