    <!-- MAIN LOGIC (non module, utilise window.supabase défini en HEAD) -->
    <script>
    (async function () {
        // helper to get elements
        const $id = (id) => document.getElementById(id);

        // wait for window.supabase and auth to be available
        async function waitForSupabaseReady(timeout = 5000) {
            const start = Date.now();
            return new Promise((resolve, reject) => {
                (function check() {
                    if (window.supabase && window.supabase.auth) return resolve(window.supabase);
                    if (Date.now() - start > timeout) return reject(new Error("Supabase not ready"));
                    setTimeout(check, 30);
                })();
            });
        }

        let supabase;
        try {
            supabase = await waitForSupabaseReady(8000);
        } catch (err) {
            console.error("Supabase didn't initialize:", err);
            alert("Erreur: impossible d'initialiser Supabase. Vérifie la clé / l'URL.");
            return;
        }

        // UI helpers
        function show(el) { if (!el) return; el.classList.remove('hidden'); el.style.display = ''; }
        function hide(el) { if (!el) return; el.classList.add('hidden'); el.style.display = 'none'; }

        // show/hide login/profile UI helpers
        function showLoginUI() {
            show(btnLogin);
            hide(profileBox);
            hide(publishArea);
            if (profileEmailDisplay) profileEmailDisplay.textContent = '';
        }
        function showProfileUI(user) {
            if (!user) return showLoginUI();
            hide(btnLogin);
            show(profileBox);
            show(publishArea);
            if (profileEmailSpan) profileEmailSpan.textContent = user.email;
            if (profileEmailDisplay) profileEmailDisplay.textContent = user.email;
        }
        
        // Elements
        const btnLogin = $id('btn-login');
        const loginDialog = $id('login-dialog');
        const signupDialog = $id('signup-dialog');
        const doLoginBtn = $id('do-login');
        const switchToSignup = $id('switch-to-signup');
        const switchToLogin = $id('switch-to-login');
        const doSignupBtn = $id('do-signup');
        const profileBox = $id('profile-box');
        const profileEmailSpan = $id('profile-email');
        const profileEmailDisplay = $id('profile-email-display');
        const btnLogout = $id('btn-logout');
        const btnLogout2 = $id('btn-logout-2');
        const btnEdit = $id('btn-edit');
        const publishArea = $id('publishArea');
        const toggleFormBtn = $id('toggleFormBtn');
        const formContainer = $id('form-container');
        const publishForm = $id('publishForm');
        const publishBtn = $id('publishBtn');
        const trajetsContainer = $id('trajets');

        const profileModalDialog = $id('profile-modal-dialog');
        const closeProfileBtn = $id('closeProfileBtn');
        const saveProfileBtn = $id('saveProfileBtn');

        // small safety: no duplicate logout functions
        async function doLogout() {
            try {
                await supabase.auth.signOut();
            } catch (err) {
                console.error('logout error', err);
            }
        }


        // Wait for initial session and set UI
        async function initAuthState() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const user = session?.user ?? null;
                if (user) showProfileUI(user); else showLoginUI();
            } catch (err) {
                console.error("initAuthState error:", err);
                showLoginUI();
            }
        }

        // Keep UI in sync
        supabase.auth.onAuthStateChange(async (event, session) => {
            try {
                const user = session?.user ?? null;
                if (user) {
                    showProfileUI(user);
                    await ensureProfilePresent(user);
                    await loadTrips();
                    await loadMyReservation();
                } else {
                    showLoginUI();
                    await loadTrips();
                }
            } catch (err) {
                console.error("onAuthStateChange error", err);
            }
        });

        // LOGIN handler
        async function loginHandler() {
            const email = ($id('login-email')?.value || '').trim().toLowerCase();
            const password = ($id('login-pass')?.value || '');
            if (!email) return alert("Entre ton email.");
            if (!email.endsWith('@ensam.eu')) return alert('Utilise une adresse @ensam.eu');

            const btn = doLoginBtn;
            if (btn) btn.disabled = true;
            try {
                if (password) {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) {
                        console.warn('signInWithPassword err', error);
                        if (confirm("Mot de passe incorrect ou erreur. Souhaites-tu recevoir un lien magique par mail ?")) {
                            const { error: otpErr } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
                            if (otpErr) alert("Erreur envoi lien : " + otpErr.message);
                            else alert("Lien envoyé !");
                        }
                    } else {
                        // success: UI will be updated by onAuthStateChange
                        hide(loginDialog);
                    }
                } else {
                    const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
                    if (error) alert("Erreur envoi lien : " + error.message);
                    else alert("Lien envoyé ! Vérifie ta boîte mail.");
                }
            } catch (err) {
                console.error("loginHandler error", err);
                alert("Erreur connexion (voir console).");
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // SIGNUP handler
        async function signupHandler() {
            const email = ($id('su-email')?.value || '').trim().toLowerCase();
            const password = ($id('su-pass')?.value || '');
            const nom = ($id('su-nom')?.value || '').trim();
            const prenom = ($id('su-prenom')?.value || '').trim();
            const surn = ($id('su-surn')?.value || '').trim();
            const fams = ($id('su-fams')?.value || '').trim();
            const promo = ($id('su-promo')?.value || '');

            if (!email || !password) return alert("Email et mot de passe requis.");
            if (!email.endsWith('@ensam.eu')) return alert('Utilise une adresse @ensam.eu');

            const btn = doSignupBtn;
            if (btn) btn.disabled = true;

            try {
                // Attempt signup
                const { data, error } = await supabase.auth.signUp({ email, password }, { emailRedirectTo: window.location.href });
                if (error) {
                    console.error('signup error', error);
                    // If email exists, show helpful message
                    if (error.message && error.message.toLowerCase().includes('already')) {
                        return alert("Cet email est déjà enregistré — connecte-toi.");
                    }
                    return alert("Inscription impossible : " + error.message);
                }

                // If we got an immediate user (sometimes auto-confirmed), create profile
                if (data?.user?.id) {
                    const profile = {
                        id: data.user.id,
                        nom, prenom, surns: surn, fams, promo
                    };
                    const { error: pErr } = await supabase.from('profiles').upsert(profile, { returning: 'minimal' });
                    if (pErr) console.warn('profile upsert error', pErr);
                } else {
                    // If confirmation required, do NOT try to insert profile as anon (may be blocked by RLS).
                    // We'll rely on the user confirming via email and signing-in; ensure UX informs them.
                    console.log('signup created; confirmation may be required');
                }

                alert("Inscription lancée ! Vérifie ta boîte mail pour confirmer si nécessaire.");
                hide(signupDialog);
            } catch (err) {
                console.error("signupHandler error", err);
                alert("Erreur lors de l'inscription (voir console).");
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // Ensure profile exists and populate publish form if possible
        async function ensureProfilePresent(user) {
            if (!user) return;
            try {
                const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
                if (error) {
                    console.warn('ensureProfilePresent read error', error);
                    return;
                }
                // set profile email display
                if (profile && profile.nom) {
                    // fill publish fields if empty
                    if ($id('nom') && !$id('nom').value) $id('nom').value = profile.nom || '';
                    if ($id('prenom') && !$id('prenom').value) $id('prenom').value = profile.prenom || '';
                    if ($id('surns_pub') && !$id('surns_pub').value) $id('surns_pub').value = profile.surns || '';
                    if ($id('fams_pub') && !$id('fams_pub').value) $id('fams_pub').value = profile.fams || '';
                    if ($id('promo') && !$id('promo').value) $id('promo').value = profile.promo || '';
                    return;
                }

                // No profile found -> try to insert minimal profile *only if* authenticated
                // This avoids 401 when anonymous inserts are blocked by RLS.
                try {
                    const { data: { user: currentUser } } = await supabase.auth.getUser();
                    if (!currentUser) return; // can't create profile when not authenticated
                    const newProfile = { id: currentUser.id, nom: '', prenom: '', surns: '', fams: '', promo: '' };
                    const { error: insertErr } = await supabase.from('profiles').insert(newProfile);
                    if (insertErr) {
                        console.warn('Could not auto-create profile (policy?)', insertErr);
                        return;
                    }
                    // open profile modal so user completes
                    openProfileModal();
                } catch (innerErr) {
                    console.warn('ensureProfilePresent inner err', innerErr);
                }
            } catch (err) {
                console.error('ensureProfilePresent fatal', err);
            }
        }

        // OPEN/CLOSE profile modal
        function openProfileModal() {
            show(profileModalDialog);
            // populate email
            supabase.auth.getUser().then(res => {
                const user = res?.data?.user;
                if (user && $id('profile-email')) $id('profile-email').textContent = user.email;
            }).catch(()=>{});
        }
        function closeProfileModal() { hide(profileModalDialog); }

        // Save profile
        async function saveProfile() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return alert('Connecte-toi !');
                const nom = ($id('profile_nom')?.value || '').trim();
                const prenom = ($id('profile_prenom')?.value || '').trim();
                const surns = ($id('profile_surns')?.value || '').trim();
                const fams = ($id('profile_fams')?.value || '').trim();
                const promo = ($id('profile_promo')?.value || '').trim();
                if (!nom || !prenom) return alert('Nom et prénom requis.');

                const { error } = await supabase.from('profiles').upsert({ id: user.id, nom, prenom, surns, fams, promo }, { returning: 'minimal' });
                if (error) return alert('Erreur en enregistrant le profil : ' + error.message);
                alert('Profil enregistré !');
                closeProfileModal();
                // refill publish
                if ($id('nom') && !$id('nom').value) $id('nom').value = nom;
                if ($id('prenom') && !$id('prenom').value) $id('prenom').value = prenom;
                if ($id('surns_pub') && !$id('surns_pub').value) $id('surns_pub').value = surns;
                if ($id('fams_pub') && !$id('fams_pub').value) $id('fams_pub').value = fams;
                if ($id('promo') && !$id('promo').value) $id('promo').value = promo;
                await loadTrips();
                await loadMyReservation();
            } catch (err) {
                console.error('saveProfile error', err);
                alert('Erreur saveProfile (voir console).');
            }
        }

        // TRIPS: load / render / publish / delete etc.
        function escapeHTML(str){ if(str === 0) return "0"; if(!str) return ''; return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
        function formatFR(dateStr){ const d=new Date(dateStr); if (isNaN(d)) return dateStr; return d.toLocaleString('fr-FR',{timeZone:'Europe/Paris', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}).replace(',',''); }
        function isExpired(dateStr){ const d=new Date(dateStr); if (isNaN(d)) return false; return new Date() > new Date(d.getTime() + 3600*1000); }
        function isEnCours(dateStr){ const d=new Date(dateStr); if (isNaN(d)) return false; const now = new Date(); return now >= d && now <= new Date(d.getTime() + 3600*1000); }

        async function loadTrips() {
            if (!trajetsContainer) return;
            trajetsContainer.innerHTML = 'Chargement...';
            try {
                const { data, error } = await supabase.from('trips').select('*');
                if (error) { trajetsContainer.innerHTML = 'Erreur : ' + (error.message || JSON.stringify(error)); return; }
                const trips = data || [];
                // basic render
                trajetsContainer.innerHTML = '';
                for (const t of trips) {
                    const el = await createTrajetElement(t);
                    trajetsContainer.appendChild(el);
                }
            } catch (err) {
                console.error('loadTrips error', err);
                trajetsContainer.innerHTML = 'Erreur chargement (voir console).';
            }
        }

        async function publishTrip(e) {
            if (e && e.preventDefault) e.preventDefault();
            try {
                const publishBtnEl = publishBtn;
                if (publishBtnEl) publishBtnEl.disabled = true;
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) { alert('Connecte-toi !'); return; }

                const departEl = $id('depart');
                const arriveeEl = $id('arrivee');
                const departValue = departEl && departEl.value === 'Autre' ? ($id('depart_autre')?.value || '') : (departEl?.value || '');
                const arriveeValue = arriveeEl && arriveeEl.value === 'Autre' ? ($id('arrivee_autre')?.value || '') : (arriveeEl?.value || '');
                const datetimeVal = ($id('datetime')?.value || '');
                if (!datetimeVal) return alert('Choisis une date et heure.');
                const datetimeISO = (new Date(datetimeVal)).toISOString();

                let publishNom = ($id('nom')?.value || '').trim();
                let publishPrenom = ($id('prenom')?.value || '').trim();
                let publishSurns = ($id('surns_pub')?.value || '').trim();
                let publishFams = ($id('fams_pub')?.value || '').trim();
                let publishPromo = ($id('promo')?.value || '').trim();

                if (!publishNom || !publishPrenom || !publishSurns || !publishFams || !publishPromo) {
                    const { data: profilData } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
                    if (profilData) {
                        publishNom = publishNom || profilData.nom || '';
                        publishPrenom = publishPrenom || profilData.prenom || '';
                        publishSurns = publishSurns || profilData.surns || '';
                        publishFams = publishFams || profilData.fams || '';
                        publishPromo = publishPromo || profilData.promo || '';
                    }
                }

                const trip = {
                    owner: user.id,
                    nom: publishNom,
                    prenom: publishPrenom,
                    surns: publishSurns,
                    fams: publishFams,
                    promo: publishPromo,
                    depart: departValue,
                    arrivee: arriveeValue,
                    datetime: datetimeISO,
                    places: parseInt($id('places')?.value || '1') || 1,
                    description: $id('desc')?.value || ''
                };

                const { data, error } = await supabase.from('trips').insert(trip);
                if (error) return alert('Erreur publication : ' + (error.message || JSON.stringify(error)));
                alert('Trajet publié !');
                if (publishForm) publishForm.reset();
                if (formContainer) formContainer.style.display = 'none';
                await loadTrips();
            } catch (err) {
                console.error('publishTrip error', err);
                alert('Erreur publication (voir console).');
            } finally {
                if (publishBtn) publishBtn.disabled = false;
            }
        }

        // Reservations RPC wrapper (depends on server-side rpc existence)
        async function reserve(tripId) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return alert('Connecte-toi !');
                const { data: profilData } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
                if (!profilData) {
                    alert('Complète ton profil avant de réserver.');
                    openProfileModal();
                    return;
                }
                const { data, error } = await supabase.rpc('reserve_trip', {
                    p_trip_id: tripId,
                    p_user_id: user.id,
                    p_nom: profilData.nom,
                    p_prenom: profilData.prenom,
                    p_surns: profilData.surns,
                    p_fams: profilData.fams,
                    p_promo: profilData.promo
                });
                if (error) return alert(error.details || error.message || JSON.stringify(error));
                alert('Réservation confirmée !');
                await loadTrips();
                await loadMyReservation();
            } catch (err) {
                console.error('reserve error', err);
                alert('Erreur reservation (voir console).');
            }
        }

        async function cancelReservation(resId) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return alert('Connecte-toi !');
                const { data, error } = await supabase.rpc('cancel_reservation', { p_reservation_id: resId, p_user_id: user.id });
                if (error || data?.ok === false) return alert(error?.message || data?.error || 'Erreur annulation.');
                alert('Réservation annulée !');
                await loadTrips();
                await loadMyReservation();
            } catch (err) {
                console.error('cancelReservation', err);
            }
        }

        async function loadMyReservation() {
            try {
                const area = $id('myReservationArea');
                const content = $id('myReservationContent');
                if (!area || !content) return;
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) { area.style.display = 'none'; return; }
                const { data, error } = await supabase.from('reservations').select('*, trips(*)').eq('user_id', user.id).eq('status', 'active').maybeSingle();
                area.style.display = 'block';
                if (!data) { content.innerHTML = 'Aucune réservation active.'; return; }
                const r = data;
                content.innerHTML = `<p><b>Trajet :</b> ${escapeHTML(r.trips.depart)} → ${escapeHTML(r.trips.arrivee)}</p>
                                     <p><b>Date :</b> ${formatFR(r.trips.datetime)}</p>
                                     <button class="btn" id="cancelResBtn">Annuler</button>`;
                document.getElementById('cancelResBtn')?.addEventListener('click', async () => cancelReservation(r.id));
            } catch (err) {
                console.error('loadMyReservation error', err);
            }
        }

        async function canViewReservations(t) {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return false;
                return user.id === t.owner;
            } catch (err) {
                console.error('canViewReservations error', err);
                return false;
            }
        }

        async function viewReservations(tripId) {
            try {
                const { data, error } = await supabase.from('reservations').select('*').eq('trip_id', tripId);
                if (error) return alert(error.message);
                if (!data || data.length === 0) return alert('Aucun réservant.');
                let msg = 'Réservants :\n\n';
                data.forEach(r => msg += `${r.prenom} ${r.nom} ${r.surns} ${r.fams} (${r.promo})\n`);
                alert(msg);
            } catch (err) {
                console.error('viewReservations error', err);
            }
        }

        async function deleteTrip(id) {
            if (!confirm('Supprimer ce trajet ?')) return;
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return alert('Connecte-toi !');
                const { data: trip, error: tripErr } = await supabase.from('trips').select('*').eq('id', id).maybeSingle();
                if (tripErr) return alert('Erreur lecture trajet : ' + tripErr.message);
                if (!trip) return alert('Trajet introuvable.');
                if (user.id !== trip.owner) return alert('Seul le publieur peut supprimer ce trajet.');
                const { error } = await supabase.from('trips').delete().eq('id', id);
                if (error) return alert(error.message);
                alert('Trajet supprimé !');
                await loadTrips();
            } catch (err) {
                console.error('deleteTrip error', err);
            }
        }

        async function createTrajetElement(t) {
            const d = document.createElement('div');
            d.className = 'trajet';
            try {
                if (isEnCours(t.datetime)) {
                    const b = document.createElement('div'); b.className = 'bandeau'; b.textContent = 'EN COURS'; d.appendChild(b);
                } else if ((t.places || 0) <= 0) {
                    const b = document.createElement('div'); b.className = 'bandeau'; b.textContent = 'PLEIN'; d.appendChild(b);
                } else if (isExpired(t.datetime)) {
                    const b = document.createElement('div'); b.className = 'bandeau'; b.textContent = 'EXPIRÉ'; b.style.background = '#6c6c6c'; d.appendChild(b);
                }

                const info = document.createElement('div'); info.className = 'trajet-info';
                info.innerHTML = `<p><span class="label-fixed">Conducteur :</span> ${escapeHTML(t.nom)} ${escapeHTML(t.prenom)}</p>
                                  <p><span class="label-fixed">Bucque :</span> ${escapeHTML(t.surns)} ${escapeHTML(t.fams)} ${escapeHTML(t.promo)}</p>
                                  <p class="label-fixed">${escapeHTML(t.depart)} ➤ ${escapeHTML(t.arrivee)}</p>
                                  <p><span class="label-fixed">Date :</span> ${formatFR(t.datetime)}</p>
                                  <p><span class="label-fixed">Places restantes :</span> ${t.places}</p>`;
                if (t.description && String(t.description).trim() !== '') info.innerHTML += `<p><span class="label-fixed">Description :</span> ${escapeHTML(t.description)}</p>`;

                const actions = document.createElement('div'); actions.className = 'action-buttons';

                const { data: { user } } = await supabase.auth.getUser();

                let reserved = false, myRes = null;
                if (user) {
                    const res = await supabase.from('reservations').select('*').eq('trip_id', t.id).eq('user_id', user.id).eq('status','active').maybeSingle();
                    myRes = res.data; reserved = !!res.data;
                }

                if (reserved) {
                    const un = document.createElement('button'); un.className = 'btn'; un.textContent = 'Annuler';
                    un.addEventListener('click', () => cancelReservation(myRes.id)); actions.appendChild(un);
                } else if ((t.places || 0) > 0 && !isEnCours(t.datetime) && !isExpired(t.datetime)) {
                    const resBtn = document.createElement('button'); resBtn.className = 'btn'; resBtn.textContent = 'Réserver';
                    resBtn.addEventListener('click', () => { if (confirm('Confirmer réservation ?')) reserve(t.id); }); actions.appendChild(resBtn);
                } else {
                    const disabled = document.createElement('button'); disabled.className = 'btn btn-disabled'; disabled.textContent = 'Réserver'; disabled.setAttribute('aria-disabled','true'); actions.appendChild(disabled);
                }

                const maySee = await canViewReservations(t);
                if (maySee) {
                    const btnRes = document.createElement('button'); btnRes.className = 'btn'; btnRes.textContent = 'Réservations'; btnRes.addEventListener('click', () => viewReservations(t.id)); actions.appendChild(btnRes);
                } else {
                    const btnRes = document.createElement('button'); btnRes.className = 'btn btn-disabled'; btnRes.textContent = 'Réservations'; btnRes.setAttribute('aria-disabled','true'); actions.appendChild(btnRes);
                }

                // if owner, show delete
                const { data: { user: currentUser } } = await supabase.auth.getUser();
                if (currentUser && currentUser.id === t.owner) {
                    const del = document.createElement('button'); del.className = 'delete-btn'; del.textContent = 'Supprimer'; del.addEventListener('click', () => deleteTrip(t.id)); actions.appendChild(del);
                }

                d.appendChild(info); d.appendChild(actions);
            } catch (err) {
                console.error('createTrajetElement error', err);
                d.textContent = 'Erreur affichage trajet.';
            }
            return d;
        }

        /* ---------- UI bindings ---------- */

        // button show login dialog
        btnLogin?.addEventListener('click', () => { show(loginDialog); hide(signupDialog); });

        // login dialog actions
        doLoginBtn?.addEventListener('click', loginHandler);
        switchToSignup?.addEventListener('click', () => { hide(loginDialog); show(signupDialog); });

        // signup dialog actions (from header dialog)
        doSignupBtn?.addEventListener('click', signupHandler);
        switchToLogin?.addEventListener('click', () => { hide(signupDialog); show(loginDialog); });

        // logout
        btnLogout?.addEventListener('click', async () => { await doLogout(); });
        btnLogout2?.addEventListener('click', async () => { await doLogout(); });

        // edit profile open modal
        btnEdit?.addEventListener('click', openProfileModal);
        $id('openProfileBtn')?.addEventListener('click', openProfileModal);
        closeProfileBtn?.addEventListener('click', closeProfileModal);
        saveProfileBtn?.addEventListener('click', saveProfile);

        // toggle publish form
        toggleFormBtn?.addEventListener('click', () => {
            if (!formContainer) return;
            formContainer.style.display = (formContainer.style.display === 'none' || formContainer.style.display === '') ? 'block' : 'none';
        });

        // publish form submit
        publishForm?.addEventListener('submit', publishTrip);

        // 'Autre' fields toggles
        ['depart','arrivee','searchDest'].forEach(id => {
            const node = $id(id);
            if (!node) return;
            node.addEventListener('change', () => {
                const inp = $id(id + '_autre');
                if (!inp) return;
                inp.style.display = (node.value === 'Autre') ? 'block' : 'none';
            });
        });

        // search handlers
        $id('searchText')?.addEventListener('input', () => { setTimeout(loadTrips, 300); });
        $id('searchDest')?.addEventListener('change', loadTrips);
        $id('searchBtn')?.addEventListener('click', loadTrips);
        $id('resetFiltersBtn')?.addEventListener('click', () => { $id('searchDest').value = ''; $id('searchOther').value = ''; $id('searchText').value = ''; loadTrips(); });

        /* ---------- Init ---------- */
        await initAuthState();
        await loadTrips();

        // Close dialogs when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === loginDialog) hide(loginDialog);
            if (e.target === signupDialog) hide(signupDialog);
            if (e.target === profileModalDialog) hide(profileModalDialog);
        });

    })();
    </script>

</body>
</html>
