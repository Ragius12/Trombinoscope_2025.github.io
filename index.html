  <meta charset="utf-8" />

  <title>Accueil — Promo 2025</title>
  <style>
    :root{
      --bg1:#090a1a; --bg2:#1a0f40; --accent:#ffd700; --text:#e6eef9; --muted:#bfc7d6;
      --card:rgba(255,255,255,0.05); --glass:rgba(255,255,255,0.08);
    }
    *{box-sizing:border-box;transition:all .4s ease}
    body,html{margin:0;padding:0;height:100%;overflow-x:hidden;
      font-family:'Poppins',sans-serif;
      background:radial-gradient(circle at top left,var(--bg1),var(--bg2));
      color:var(--text)}
    a{color:inherit;text-decoration:none}

    #bgCanvas{position:fixed;inset:0;z-index:0;filter:blur(1px);}

    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:36px;position:relative;z-index:1;overflow:hidden;}
    .hero::before{content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 50% 50%,rgba(255,255,255,0.06),transparent 70%);
      animation:pulse 6s infinite alternate ease-in-out;}
    @keyframes pulse{from{opacity:.3;transform:scale(1);}
      to{opacity:.7;transform:scale(1.1);} }

    .shell{width:1100px;max-width:95%;backdrop-filter:blur(10px) saturate(1.3);
      background:var(--glass);border-radius:24px;padding:30px;
      box-shadow:0 10px 40px rgba(2,6,23,0.8);
      display:grid;grid-template-columns:420px 1fr;gap:24px;
      border:1px solid rgba(255,255,255,0.1)}

    .brand{display:flex;flex-direction:column;gap:16px;align-items:flex-start;
      animation:slideInLeft 1.2s ease}
    @keyframes slideInLeft{from{opacity:0;transform:translateX(-40px);}
      to{opacity:1;transform:translateX(0);} }

    .logo{
      height:90px;width:90px;border-radius:25px;
      display:flex;align-items:center;justify-content:center;font-weight:900;
      animation:float 4s ease-in-out infinite;
      position:relative;
    }
    @keyframes float{0%{transform:translateY(0);}
      50%{transform:translateY(-10px);}
      100%{transform:translateY(0);} }

    .logo img.left{
      transform:scaleX(-1);
      width:90px;
      height:auto;
    }

    .tooltip {
      visibility: hidden;
      width: 150px;
      background-color: black;
      color: #fff;
      text-align: center;
      padding: 5px 10px;
      border-radius: 5px;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .logo:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    .title{font-family:'Cinzel',serif;font-size:30px;
      color:var(--accent);text-shadow:0 0 20px rgba(255,215,0,0.4)}
    .subtitle{color:var(--muted);font-size:14px;animation:fadeIn 1.6s ease}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

    .promo-photo {
      width:100%;
      border-radius:18px;
      margin-top:14px;
      box-shadow:0 8px 30px rgba(0,0,0,0.4);
      transition:transform 0.4s ease, box-shadow 0.4s ease;
      animation:fadeInUp 1.2s ease;
    }
    .promo-photo:hover {
      transform:scale(1.03);
      box-shadow:0 12px 40px rgba(0,0,0,0.5);
    }
    @keyframes fadeInUp {
      from {opacity:0; transform:translateY(20px);}
      to {opacity:1; transform:translateY(0);}
    }

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px;animation:slideInUp 1.2s ease}
    @keyframes slideInUp{from{opacity:0;transform:translateY(40px);}
      to{opacity:1;transform:translateY(0);} }

    .card{background:var(--card);padding:18px;border-radius:16px;
      border:1px solid rgba(255,255,255,0.05);position:relative;
      overflow:hidden;cursor:pointer;backdrop-filter:blur(4px)}
    .card:hover{transform:translateY(-12px) scale(1.02);
      box-shadow:0 10px 50px rgba(255,255,255,0.08)}
    .card::after{content:'';position:absolute;inset:0;
      background:linear-gradient(120deg,rgba(255,255,255,0.15),transparent 70%);
      transform:translateX(-100%);transition:1s;opacity:0.2}
    .card:hover::after{transform:translateX(100%)}

    .label{font-weight:700;font-size:17px;margin-bottom:6px}
    .desc{font-size:13px;color:var(--muted)}

    .footer{grid-column:1/-1;text-align:center;margin-top:10px;
      color:var(--muted);font-size:13px;animation:fadeIn 2s ease}

    /* 🔹 Responsive styles 🔹 */
    @media(max-width:950px){
      .shell{grid-template-columns:1fr;padding:20px;}
      .brand{align-items:center;text-align:center;}
      .title{font-size:26px;}
    }

    @media(max-width:650px){
      .hero{padding:20px;}
      .shell{padding:18px;}
      .title{font-size:22px;}
      .subtitle{font-size:13px;}
      .logo{height:70px;width:70px;}
      .logo img.left{width:70px;}
      .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
      .label{font-size:15px;}
      .desc{font-size:12px;}
      .promo-photo{border-radius:12px;}
    }

    @media(max-width:450px){
      .title{font-size:20px;}
      .subtitle{font-size:12px;}
      .card{padding:14px;}
      .logo{height:60px;width:60px;}
      .logo img.left{width:60px;}
      .grid{gap:10px;}
    }
  </style>

<!-- AUTH BAR (AJOUTÉE, SANS TOUCHER AU RESTE) -->
<div id="authBar" style="position:fixed;top:16px;right:20px;z-index:9999;display:flex;gap:10px">
  <button id="btnSignup">S’inscrire</button>
  <button id="btnLogin">Se connecter</button>
  <span id="userEmail" style="display:none"></span>
  <button id="btnProfile" style="display:none">Modifier mon profil</button>
  <button id="btnLogout" style="display:none">Se déconnecter</button>
</div>

<!-- MODAL AUTH -->
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center">
  <div style="background:white;padding:20px;border-radius:10px;width:360px">
    <h3 id="authTitle"></h3>
    <input id="authEmail" placeholder="Email ENSAM" style="width:100%;margin:6px 0">
    <input id="authPassword" type="password" placeholder="Mot de passe" style="width:100%;margin:6px 0">
    <button id="authConfirm" style="width:100%;margin-top:10px">Valider</button>
  </div>
</div>

<!-- MODAL PROFIL OBLIGATOIRE -->
<div id="profileModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10001;align-items:center;justify-content:center">
  <div style="background:white;padding:20px;border-radius:10px;width:380px">
    <h3>Compléter votre profil</h3>
    <input id="pPrenom" placeholder="Prénom" required>
    <input id="pNom" placeholder="Nom" required>
    <input id="pBirth" type="date" value="2004-01-01" required>
    <input id="pSurns" placeholder="Surn’s" required>
    <input id="pFams" placeholder="Fam’s" required>
    <select id="pPromo">
      <option>An223</option>
      <option>An224</option>
      <option>An225</option>
    </select>
    <button onclick="saveProfile()" style="width:100%;margin-top:10px">Enregistrer</button>
  </div>
</div>

<script type="module">
const sb = window.supabase;

const qs = id => document.getElementById(id);

async function refreshAuth(){
  const { data:{session} } = await sb.auth.getSession();
  if(session){
    qs("btnSignup").style.display="none";
    qs("btnLogin").style.display="none";
    qs("userEmail").style.display="inline";
    qs("btnProfile").style.display="inline";
    qs("btnLogout").style.display="inline";
    qs("userEmail").innerText=session.user.email;

    const { data } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
    if(!data || !data.prenom) qs("profileModal").style.display="flex";
  }
}

refreshAuth();
sb.auth.onAuthStateChange(refreshAuth);

qs("btnSignup").onclick=()=>openAuth("signup");
qs("btnLogin").onclick=()=>openAuth("login");

function openAuth(mode){
  qs("authModal").style.display="flex";
  qs("authTitle").innerText=mode==="signup"?"Inscription":"Connexion";
  qs("authConfirm").onclick=()=>mode==="signup"?signup():login();
}

async function signup(){
  const email=authEmail.value;
  if(!email.endsWith("@ensam.eu") && email!=="thomas.bourdon12112004@gmail.com")
    return alert("Email non autorisé");

  await sb.auth.signUp({
    email,
    password:authPassword.value,
    options:{ emailRedirectTo:"https://ragius12.github.io/Trombinoscope_2025.github.io/" }
  });
  alert("Mail envoyé !");
}

async function login(){
  const { error } = await sb.auth.signInWithPassword({
    email:authEmail.value,
    password:authPassword.value
  });
  if(error) alert(error.message);
}

qs("btnLogout").onclick=()=>sb.auth.signOut();

window.saveProfile = async()=>{
  const { data:{user} } = await sb.auth.getUser();
  await sb.from("profiles").upsert({
    id:user.id,
    prenom:pPrenom.value,
    nom:pNom.value,
    anniversaire:pBirth.value,
    surns:pSurns.value,
    fams:pFams.value,
    promo:pPromo.value
  });
  qs("profileModal").style.display="none";
};

window.openPage = path =>{
  sb.auth.getSession().then(({data:{session}})=>{
    if(!session) return alert("Veuillez vous connecter");
    window.open(path,"_blank");
  });
};
</script>
