<!-- AUTH BAR (AJOUTÉE, SANS TOUCHER AU RESTE) -->
<div id="authBar" style="position:fixed;top:16px;right:20px;z-index:9999;display:flex;gap:10px">
  <button id="btnSignup">S’inscrire</button>
  <button id="btnLogin">Se connecter</button>
  <span id="userEmail" style="display:none"></span>
  <button id="btnProfile" style="display:none">Modifier mon profil</button>
  <button id="btnLogout" style="display:none">Se déconnecter</button>
</div>

<!-- MODAL AUTH -->
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;align-items:center;justify-content:center">
  <div style="background:white;padding:20px;border-radius:10px;width:360px">
    <h3 id="authTitle"></h3>
    <input id="authEmail" placeholder="Email ENSAM" style="width:100%;margin:6px 0">
    <input id="authPassword" type="password" placeholder="Mot de passe" style="width:100%;margin:6px 0">
    <button id="authConfirm" style="width:100%;margin-top:10px">Valider</button>
  </div>
</div>

<!-- MODAL PROFIL OBLIGATOIRE -->
<div id="profileModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10001;align-items:center;justify-content:center">
  <div style="background:white;padding:20px;border-radius:10px;width:380px">
    <h3>Compléter votre profil</h3>
    <input id="pPrenom" placeholder="Prénom" required>
    <input id="pNom" placeholder="Nom" required>
    <input id="pBirth" type="date" value="2004-01-01" required>
    <input id="pSurns" placeholder="Surn’s" required>
    <input id="pFams" placeholder="Fam’s" required>
    <select id="pPromo">
      <option>An223</option>
      <option>An224</option>
      <option>An225</option>
    </select>
    <button onclick="saveProfile()" style="width:100%;margin-top:10px">Enregistrer</button>
  </div>
</div>

<!-- RIEN N’A ÉTÉ SUPPRIMÉ -->

<script type="module">
const sb = window.supabase;

const qs = id => document.getElementById(id);

async function refreshAuth(){
  const { data:{session} } = await sb.auth.getSession();
  if(session){
    qs("btnSignup").style.display="none";
    qs("btnLogin").style.display="none";
    qs("userEmail").style.display="inline";
    qs("btnProfile").style.display="inline";
    qs("btnLogout").style.display="inline";
    qs("userEmail").innerText=session.user.email;

    const { data } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
    if(!data || !data.prenom) qs("profileModal").style.display="flex";
  }
}

refreshAuth();
sb.auth.onAuthStateChange(refreshAuth);

qs("btnSignup").onclick=()=>openAuth("signup");
qs("btnLogin").onclick=()=>openAuth("login");

function openAuth(mode){
  qs("authModal").style.display="flex";
  qs("authTitle").innerText=mode==="signup"?"Inscription":"Connexion";
  qs("authConfirm").onclick=()=>mode==="signup"?signup():login();
}

async function signup(){
  const email=authEmail.value;
  if(!email.endsWith("@ensam.eu") && email!=="thomas.bourdon12112004@gmail.com")
    return alert("Email non autorisé");

  await sb.auth.signUp({
    email,
    password:authPassword.value,
    options:{ emailRedirectTo:"https://ragius12.github.io/Trombinoscope_2025.github.io/" }
  });
  alert("Mail envoyé !");
}

async function login(){
  const { error } = await sb.auth.signInWithPassword({
    email:authEmail.value,
    password:authPassword.value
  });
  if(error) alert(error.message);
}

qs("btnLogout").onclick=()=>sb.auth.signOut();

window.saveProfile = async()=>{
  const { data:{user} } = await sb.auth.getUser();
  await sb.from("profiles").upsert({
    id:user.id,
    prenom:pPrenom.value,
    nom:pNom.value,
    anniversaire:pBirth.value,
    surns:pSurns.value,
    fams:pFams.value,
    promo:pPromo.value
  });
  qs("profileModal").style.display="none";
};

window.openPage = path =>{
  sb.auth.getSession().then(({data:{session}})=>{
    if(!session) return alert("Veuillez vous connecter");
    window.open(path,"_blank");
  });
};
</script>
